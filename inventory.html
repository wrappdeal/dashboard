<style>
:root{--navy:#0E5A51;--navy2:#14786C;--gold:#F8BC00;--bg:#F3F7F6;--card:#fff;--line:#D9E3E1;--txt:#14201E;--mut:#5F7270;--red:#B3261E;--redbg:#FDECEA;--grn:#1B7A3E;--grnbg:#E7F5EC;--amb:#8A6100;--ambbg:#FFF4D6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:var(--bg);color:var(--txt)}
header{background:#fff;color:var(--txt);padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--navy2);box-shadow:0 2px 0 var(--gold)}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:44px;width:auto;display:block}.brand span{font-size:13px;font-weight:bold;color:var(--navy);border-left:2px solid var(--gold);padding-left:12px;letter-spacing:.3px}
.mon{display:flex;align-items:center;gap:6px}
.mon input{padding:6px;border-radius:6px;border:1px solid var(--line);font-size:14px;color:var(--txt)}
.mon button{background:var(--navy2);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:4}
nav button{flex:0 0 auto;border:0;background:none;padding:12px 14px;font-size:14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--navy);font-weight:bold;border-color:var(--gold)}
main{padding:14px;max-width:1280px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--navy2)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:20px;font-weight:bold;color:var(--navy);margin-top:3px}
.kpi .n{font-size:11px;color:var(--mut);margin-top:3px}
.kpi.warn{border-color:#E0A800;background:var(--ambbg)}.kpi.bad{border-color:var(--red);background:var(--redbg)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th{background:var(--navy);color:#fff;font-size:11px;padding:7px 6px;text-align:left;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:5px 6px;white-space:nowrap}
td.r,th.r{text-align:right}
tr.tot td{font-weight:bold;background:#E6F1EF}
input.in,select.in,textarea.in{border:1px solid #B9C4D0;border-radius:6px;padding:6px;font-size:13px;background:#FFFDF2;color:#0000CC;max-width:100%}
input.in[type=number]{width:92px;text-align:right}
input.in.w{width:200px}select.in{padding:5px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.frm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.frm input,.frm select{width:100%;border:1px solid #B9C4D0;border-radius:6px;padding:8px;font-size:14px;background:#FFFDF2}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.gold{background:var(--gold);color:#222}
.btn.del{background:#fff;color:var(--red);border:1px solid var(--red);padding:4px 8px;font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.ok{background:var(--grnbg);color:var(--grn)}.bad{background:var(--redbg);color:var(--red)}.warn{background:var(--ambbg);color:var(--amb)}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar .lab{width:110px;font-size:12px}
.bar .tr{flex:1;background:#E9EEF4;border-radius:4px;height:20px;overflow:hidden}.bar .fi{height:100%;background:var(--navy2)}
.bar .fi.old{background:var(--red)}.bar .val{width:150px;font-size:12px;text-align:right}
.msg{padding:10px;border-radius:8px;margin-bottom:10px;background:var(--ambbg);color:var(--amb)}
.disc{font-size:11px;color:var(--mut);padding:10px 14px;text-align:center}
.sync{font-size:12px;color:var(--mut)}
@media(max-width:600px){.kpi .v{font-size:17px}.bar .val{width:100px}}
@media print{header,nav,.btn,.mon{display:none}}
</style>
</head>

<div class="disc">Management tool, not statutory accounts. Inventory is valued at the lower of cost and net realisable value (IAS 2). Have your accountant confirm treatment before using any figure in statutory accounts.</div>

<script>
//CALC-START
const KEY='wd_inv_v1', GHKEY='wd_inv_gh', DIRTY='wd_inv_dirty';
const DEF_SLABS=[{label:'Next slab 1',width:400000,rate:10},{label:'Next slab 2',width:500000,rate:15},{label:'Next slab 3',width:500000,rate:20},{label:'Next slab 4',width:1875000,rate:25},{label:'Next slab 5',width:26350000,rate:30},{label:'Balance',width:'',rate:35}];
const DEF_BANDS=[
 {label:'0-30 days',from:0,cls:'Fresh stock',resp:'Normal sales monitoring.'},
 {label:'31-60 days',from:31,cls:'Regular stock',resp:'Check sales velocity against plan.'},
 {label:'61-90 days',from:61,cls:'Slow-moving watch',resp:'Review price, visibility and replenishment.'},
 {label:'91-180 days',from:91,cls:'Slow-moving',resp:'Prepare targeted promotion or transfer plan.'},
 {label:'181-365 days',from:181,cls:'Very slow-moving',resp:'Management review; restrict repeat purchases; assess clearance options.'},
 {label:'Over 365 days',from:366,cls:'Non-moving / aged',resp:'SKU-level NRV assessment and documented exit decision.'}];
const POOLS=[
 {id:'P01',name:'Warehouse rent',driver:'Space-days (carton/shelf space x days)',alloc:true},
 {id:'P02',name:'Warehouse salaries',driver:'Staff hours on receiving, picking, packing, stock control',alloc:true},
 {id:'P03',name:'Utilities',driver:'Occupied area (m2)',alloc:true},
 {id:'P04',name:'Handling',driver:'Cartons / units handled in the month',alloc:true},
 {id:'P05',name:'Insurance',driver:'Insured inventory value (automatic)',alloc:true},
 {id:'P06',name:'Maintenance',driver:'Occupied area (m2)',alloc:true},
 {id:'P07',name:'Abnormal / idle capacity',driver:'Not allocated - shown separately',alloc:false},
 {id:'P08',name:'Actual financing expense',driver:'Not allocated - own line (real borrowing cost)',alloc:false},
 {id:'P09',name:'Other operating expenses (marketing, courier, admin)',driver:'Not allocated - own line',alloc:false}];
const STEPS=['Close stock movements (every lot, with physical count)','Confirm landed cost on new lots','Check ageing for the reporting month','Record actual cost pools','Fill cost drivers and reconcile','Review NRV evidence for aged lots','Partners review dashboard, log actions'];
const ACTIONS=['Clearance sale','Return to supplier','Bundle / combo offer','Channel transfer','Restrict reorder','Price review','Other'];
const DECISIONS=[['Inventory costing method','Confirm FIFO or weighted average with the accountant; apply consistently.'],['Ageing basis','Receipt / lot date; keep lot-level ageing for mixed receipts.'],['Ageing thresholds','Adopt the bands initially; revise to the real sales cycle.'],['Cost allocation drivers','Approve a driver per pool and document the reason.'],['Capital cost rate','Actual financing data where relevant; approve any management-only opportunity rate separately.'],['NRV approval authority','Set the BDT threshold for finance review vs partner approval.'],['Non-moving action trigger','Define when reorders are blocked and a clearance plan is mandatory.'],['Monthly close date','Fixed month-end cut-off and a fixed reporting deadline.']];
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};
const has=v=>v!==''&&v!=null&&isFinite(parseFloat(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=v=>v==null||v===''||!isFinite(v)?'–':Math.round(v).toLocaleString('en-US');
const f2=v=>v==null||v===''||!isFinite(v)?'–':Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%';
function eom(m){const[y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);}
function prevM(m){let[y,mo]=m.split('-').map(Number);mo--;if(mo<1){mo=12;y--;}return y+'-'+String(mo).padStart(2,'0');}
function nextM(m){let[y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++;}return y+'-'+String(mo).padStart(2,'0');}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5);}
function monLabel(m){return new Date(m+'-01T00:00:00Z').toLocaleString('en-AU',{month:'short',year:'numeric',timeZone:'UTC'});}
function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function blank(){return{v:1,settings:{month:curMonth(),capRate:12,nonMoving:365,block:181,approval:10000,maxCover:3,method:'Lot cost, FIFO',vatMode:'none',vatRate:15,turnoverRate:4,priceIncVat:'No',costIncVat:'No',claimPct:100,itMode:'individual',threshold:375000,minTax:5000,flatRate:25,projection:'Yes',aitPaid:0,autoImport:'Yes',feedStamp:'',slabs:JSON.parse(JSON.stringify(DEF_SLABS)),bands:JSON.parse(JSON.stringify(DEF_BANDS))},skus:[],lots:[],moves:[],income:[],pools:[],drivers:[],nrv:[],actions:[],checks:{},purchases:[],close:[],decisions:DECISIONS.map(x=>({decision:x[0],recommended:x[1],decided:'',date:''}))};}
let S=blank();

function unitCost(l){return n(l.qty)>0?n(l.price)+n(l.landed)/n(l.qty):null;}
function qtyAt(l,m){
  const end=eom(m); if(!l.date||l.date>end) return 0;
  let q=n(l.qty)-n(l.preOut);
  for(const x of S.moves) if(x.lot===l.ref&&x.month<=m) q+=-n(x.sales)+n(x.retIn)-n(x.retOut)-n(x.other);
  return q;
}
function bandIdx(age){const b=S.settings.bands;let k=0;b.forEach((x,i)=>{if(n(x.from)<=age)k=i;});return k;}
function lotInfo(l,m){
  const uc=unitCost(l),close=qtyAt(l,m),open=qtyAt(l,prevM(m));
  const age=(close>0&&l.date)?daysBetween(l.date,eom(m)):null;
  return{l,ref:l.ref,sku:l.sku,uc,close,open,closeVal:uc==null?0:close*uc,openVal:uc==null?0:open*uc,age,
    band:age==null?null:bandIdx(age),received:(l.date&&l.date.slice(0,7)===m)?n(l.qty):0};
}
function allocate(m,infos){
  const amt={};POOLS.forEach(p=>amt[p.id]=S.pools.filter(x=>x.month===m&&x.pool===p.id).reduce((s,x)=>s+n(x.amount),0));
  const keys=['P01','P02','P03','P04','P05','P06'],rows={},tot={};
  infos.forEach(i=>{const d=S.drivers.find(x=>x.month===m&&x.lot===i.ref)||{};
    rows[i.ref]={drv:{P01:n(d.space),P02:n(d.hours),P03:n(d.area),P04:n(d.handled),P05:i.closeVal,P06:n(d.area)}};});
  keys.forEach(k=>{tot[k]=infos.reduce((a,i)=>a+rows[i.ref].drv[k],0);});
  infos.forEach(i=>{let t=0;const a={};keys.forEach(k=>{a[k]=tot[k]>0?rows[i.ref].drv[k]/tot[k]*amt[k]:0;t+=a[k];});rows[i.ref].a=a;rows[i.ref].total=t;});
  const unalloc=keys.reduce((s,k)=>s+(tot[k]>0?0:amt[k]),0);
  return{amt,tot,rows,unalloc};
}
function nrvFor(ref,m){return S.nrv.filter(e=>e.lot===ref&&e.month<=m).sort((a,b)=>b.month.localeCompare(a.month))[0]||null;}
function nrvCalc(i,m){
  const e=nrvFor(i.ref,m),st=S.settings;
  const trig=i.age==null?'No stock':i.age>=n(st.nonMoving)?'MANDATORY':i.age>=n(st.block)?'Recommended':'Routine';
  let nrv=null,wdu=null,wd=0;
  if(e&&has(e.price)&&i.uc!=null){nrv=n(e.price)-n(e.costSell)-n(e.completion);wdu=Math.max(0,i.uc-nrv);wd=wdu*i.close;}
  const needEv=trig==='MANDATORY'&&(!e||!has(e.price)||!(e.evidence||'').trim());
  const route=wd>=n(st.approval)&&wd>0?'Partner approval':(wd>0?'Finance review':'');
  return{e,nrv,wdu,wd,trig,needEv,route,carried:!!e&&e.month!==m};
}
function report(m){
  const st=S.settings,infos=S.lots.map(l=>lotInfo(l,m)),stock=infos.filter(i=>i.close>0);
  const A=allocate(m,stock);
  let cum=0;
  [...new Set(S.pools.map(p=>p.month))].filter(x=>x<=m).sort().forEach(mm=>{
    const inf=S.lots.map(l=>lotInfo(l,mm)).filter(i=>i.close>0),a=allocate(mm,inf);
    inf.forEach(i=>{if(stock.find(s=>s.ref===i.ref))cum+=a.rows[i.ref].total;});});
  const nrv={};let wd=0;stock.forEach(i=>{nrv[i.ref]=nrvCalc(i,m);wd+=nrv[i.ref].wd;});
  const closeVal=stock.reduce((s,i)=>s+i.closeVal,0),units=stock.reduce((s,i)=>s+i.close,0);
  const openVal=infos.reduce((s,i)=>s+i.openVal,0),avgInv=(openVal+closeVal)/2;
  const mv=S.moves.filter(x=>x.month===m);
  const cogs=mv.reduce((s,x)=>{const l=S.lots.find(l=>l.ref===x.lot),uc=l?unitCost(l):null;return s+(uc==null?0:(n(x.sales)-n(x.retIn))*uc);},0);
  const sold=mv.reduce((s,x)=>s+n(x.sales)-n(x.retIn),0);
  const avail=infos.reduce((s,i)=>s+Math.max(0,i.open)+i.received,0);
  const dim=new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate();
  const nonMovVal=stock.filter(i=>i.age>=n(st.nonMoving)).reduce((s,i)=>s+i.closeVal,0);

function b64e(s){return btoa(unescape(encodeURIComponent(s)));}function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))));}
const dirPath=()=>{const d=(GH.dir||'').replace(/^\/+|\/+$/g,'');return d?d+'/':'';};
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
function api(path,method,body){return fetch('https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+path,{method:method||'GET',headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});}
async function ghHead(){const r=await api('/git/ref/heads/'+encodeURIComponent(GH.branch));if(!r.ok)return null;return(await r.json()).object.sha;}
async function ghPull(silent){
  if(!GH.token){if(!silent)alert('Add your GitHub token in Settings first.');return;}
  syncState='Pulling CSV files from GitHub…';setSync();
  try{
    const map={};let found=0;
    for(const f of fileNames()){const r=await api('/contents/'+encPath(dirPath()+f)+'?ref='+encodeURIComponent(GH.branch));
      if(r.status===404)continue;if(!r.ok)throw new Error('GitHub '+r.status+' reading '+f);
      const j=await r.json();map[f]=b64d(j.content);found++;}
    if(!found){syncState='No CSV files on GitHub yet - use Push to create them.';setSync();return;}
    S=applyFiles(map);localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(DIRTY,'0');
    lastCommit=await ghHead();if(lastCommit)localStorage.setItem('wd_inv_commit',lastCommit);
    syncState='Pulled '+found+' CSV files ✓';setSync();render();
  }catch(e){syncState='Pull failed: '+e.message;setSync();if(!silent)alert(syncState);}
}
async function ghPush(silent){
  if(!GH.token){if(!silent)alert('Add your GitHub token in Settings first.');return;}
  syncState='Pushing CSV files to GitHub…';setSync();
  try{
    const files=allFiles();let head=await ghHead();
    if(head&&head!==lastCommit&&!silent&&!confirm('GitHub has changes this device has not pulled. Overwrite the CSV files on GitHub with this device’s data?')){syncState='Push cancelled';setSync();return;}
    if(head&&head!==lastCommit&&silent)throw new Error('GitHub has newer changes - Pull first');
    if(!head){const r=await api('/contents/'+encPath(dirPath()+'settings.csv'),'PUT',{message:'Initialise WrappDeal inventory data',content:b64e(files['settings.csv']),branch:GH.branch});
      if(!r.ok)throw new Error('GitHub '+r.status+' - check repo, branch and token permissions');head=await ghHead();if(!head)throw new Error('Could not read branch '+GH.branch);}
    const cm=await(await api('/git/commits/'+head)).json();
    const tr=await api('/git/trees','POST',{base_tree:cm.tree.sha,tree:Object.entries(files).map(([name,text])=>({path:dirPath()+name,mode:'100644',type:'blob',content:text}))});
    if(!tr.ok)throw new Error('GitHub '+tr.status+' creating tree');
    const tj=await tr.json();
    const cr=await api('/git/commits','POST',{message:'Inventory update '+new Date().toISOString().slice(0,16).replace('T',' '),tree:tj.sha,parents:[head]});
    if(!cr.ok)throw new Error('GitHub '+cr.status+' creating commit');
    const cj=await cr.json();
    const up=await api('/git/refs/heads/'+encodeURIComponent(GH.branch),'PATCH',{sha:cj.sha});
    if(!up.ok)throw new Error('GitHub '+up.status+' updating branch');
    lastCommit=cj.sha;localStorage.setItem('wd_inv_commit',lastCommit);localStorage.setItem(DIRTY,'0');syncState='Pushed '+Object.keys(files).length+' CSV files ✓';setSync();
  }catch(e){syncState='Push failed: '+e.message;setSync();if(!silent)alert(syncState);}
}

function readFeedLocal(){try{return JSON.parse(localStorage.getItem('wd_feed_v1')||'null');}catch(e){return null;}}
async function fetchFeedRemote(){if(!GH.token)return null;const r=await api('/contents/'+encPath(dirPath()+'dashboard_feed.json')+'?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now());if(!r.ok)return null;try{return JSON.parse(b64d((await r.json()).content));}catch(e){return null;}}
function importFeed(f){
  const mine=r=>/^(DB-|OPEN-)/.test(r);
  const oldRefs=new Set(S.lots.filter(l=>mine(l.ref)).map(l=>l.ref));
  S.lots=S.lots.filter(l=>!oldRefs.has(l.ref));S.moves=S.moves.filter(x=>!oldRefs.has(x.lot));
  S.income=S.income.filter(x=>x.source!=='dashboard');S.pools=S.pools.filter(x=>!String(x.source||'').startsWith('dashboard'));
  let newSku=0;
  (f.products||[]).forEach(p=>{if(!p.code)return;let k=S.skus.find(x=>x.code===p.code);
    if(!k){S.skus.push({code:p.code,name:p.name,category:'Other',supplier:'',unit:'pcs',active:'Yes',markPrice:'',sellPrice:p.price||'',reorder:'',max:''});newSku++;}
    else if(!has(k.sellPrice)&&p.price)k.sellPrice=p.price;});
  let nLots=0,nMoves=0,months=new Set();
  (f.products||[]).forEach(p=>{if(!p.code)return;
    const buys=(f.purchases||[]).filter(u=>u.code===p.code&&n(u.qty)>0).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const sal=(f.sales||[]).filter(x=>x.code===p.code&&n(x.qty)>0).sort((a,b)=>a.month.localeCompare(b.month));
    const sold=sum(sal,x=>n(x.qty)),bought=sum(buys,u=>n(u.qty));
    const open=Math.max(0,n(p.stock)+sold-bought,sold-bought);
    const first=[buys[0]&&String(buys[0].date).slice(0,10),sal[0]&&sal[0].month+'-01'].filter(Boolean).sort()[0]||new Date().toISOString().slice(0,10);
    const lots=[];
    if(open>0)lots.push({ref:'OPEN-'+p.code,date:first,sku:p.code,qty:open,price:n(p.cost),landed:0,preOut:0,doc:'dashboard opening stock'});
    buys.forEach((u,i)=>lots.push({ref:'DB-'+p.code+'-'+(i+1),date:String(u.date).slice(0,10),sku:p.code,qty:n(u.qty),price:n(u.cost),landed:0,preOut:0,doc:'dashboard purchase'}));
    lots.sort((a,b)=>a.date.localeCompare(b.date));
    lots.forEach(l=>{l.left=n(l.qty);});
    sal.forEach(x=>{let need=n(x.qty);const tot=n(x.qty),rv=n(x.revenue);
      const pick=()=>lots.find(l=>l.left>0&&l.date.slice(0,7)<=x.month)||lots.find(l=>l.left>0);
      while(need>0){const l=pick();if(!l)break;const q=Math.min(l.left,need);l.left-=q;need-=q;
        let mv=S.moves.find(y=>y.month===x.month&&y.lot===l.ref);if(!mv){mv={month:x.month,lot:l.ref,sales:0,retIn:0,retOut:0,other:0,count:'',revenue:0};S.moves.push(mv);nMoves++;}
        mv.sales=n(mv.sales)+q;mv.revenue=Math.round((n(mv.revenue)+rv*q/tot)*100)/100;months.add(x.month);}});
    lots.forEach(l=>{delete l.left;S.lots.push(l);nLots++;});});
  (f.monthly||[]).forEach(x=>{if(n(x.delivery)>0)S.income.push({month:x.month,type:'Delivery charges',amount:Math.round(n(x.delivery)*100)/100,source:'dashboard'});});
  const pm={};(f.expenses||[]).forEach(e=>{const id=EXPMAP[e.cat]||'P09';const k=e.month+'|'+id;pm[k]=(pm[k]||0)+n(e.amount);});
  (f.monthly||[]).forEach(x=>{if(n(x.courier)>0){const k=x.month+'|P09';pm[k]=(pm[k]||0)+n(x.courier);}});
  let skipped=0,nPools=0;
  Object.entries(pm).forEach(([k,a])=>{const[m,id]=k.split('|');if(S.pools.find(y=>y.month===m&&y.pool===id)){skipped++;return;}
    S.pools.push({month:m,pool:id,amount:Math.round(a*100)/100,source:'dashboard'});nPools++;months.add(m);});
  const all=[...months].sort();if(all.length&&!all.includes(S.settings.month))S.settings.month=all[all.length-1];
  S.settings.feedStamp=f.updated||'';
  return'Imported from dashboard: '+nLots+' lots, '+nMoves+' movement rows, '+nPools+' cost-pool rows'+(newSku?', '+newSku+' new products':'')+(skipped?' ('+skipped+' pool rows skipped - you entered them manually)':'')+(f.unmapped?' · '+f.unmapped+' order lines had no matching product':'')+'.';
}
async function doImport(remote){
  let f=remote?null:readFeedLocal();
  if(!f)f=await fetchFeedRemote();
  if(!f){alert('No dashboard feed found. Open the main dashboard in this browser once (or sign in with the same GitHub token) so it can publish the feed.');return;}
  const msg=importFeed(f);syncState=msg;save();render();
}
function autoImport(){
  if(S.settings.autoImport==='No')return;const f=readFeedLocal();
  if(!f||!f.updated||f.updated===S.settings.feedStamp)return;
  syncState=importFeed(f);save();render();
}

   <div><label>Input VAT claimable (%)</label>${inp('setting',{f:'claimPct'},st.claimPct)}</div>
   <div><label>Income tax method</label>${sel('setting',{f:'itMode'},st.itMode,['individual','flat','none'])}<div class="note">individual = sole proprietor slabs · flat = company rate</div></div>
   <div><label>Tax-free threshold (BDT / year)</label>${inp('setting',{f:'threshold'},st.threshold)}</div>
   <div><label>Minimum tax (BDT)</label>${inp('setting',{f:'minTax'},st.minTax)}</div>
   <div><label>Flat company rate (%)</label>${inp('setting',{f:'flatRate'},st.flatRate)}</div>
   <div><label>Annualise year-to-date profit?</label>${sel('setting',{f:'projection'},st.projection,['Yes','No'])}<div class="note">Yes = estimate the full-year tax from profit so far.</div></div>
   <div><label>Advance tax already paid / deducted (BDT, this year)</label>${inp('setting',{f:'aitPaid'},st.aitPaid)}</div></div>
   <h3>Income tax slabs (individual)</h3>${table(['Slab',['Width (BDT)','r'],['Rate %','r']],st.slabs.map((x,i)=>`<tr><td>${inp('grid',{t:'slabs',i,f:'label'},x.label,'text')}</td><td>${inp('grid',{t:'slabs',i,f:'width'},x.width)}</td><td>${inp('grid',{t:'slabs',i,f:'rate'},x.rate)}</td></tr>`))}
   <div class="note"><b>Verify these defaults.</b> They follow the FY2026-27 budget reporting (tax-free Tk 375,000, the 5% slab removed, 30% up to Tk 3 crore and 35% above, flat minimum tax Tk 5,000), but the middle slab widths are approximated and sources differ (one reports Tk 400,000). Replace them with the table your accountant confirms. Leave the last width blank for the balance.</div></div>`;
  const rw=(l,a,b,bold)=>`<tr${bold?' class="tot"':''}><td>${l}</td><td class="r">${f0(a)}</td><td class="r">${b===undefined?'':f0(b)}</td></tr>`;
  h+=`<div class="card"><h2>1. VAT / turnover tax <span class="note">(${st.vatMode==='none'?'not applied - switch on above if registered':st.vatMode==='vat'?'standard VAT':'turnover tax'})</span></h2>${table(['BDT',['Month '+monLabel(m),'r'],['Year to date ('+fy.label+')','r']],[
   rw('Taxable turnover (sales + delivery charges)',T.im.turnover,T.iy.turnover),
   st.vatMode==='vat'?rw('Output VAT',T.im.out,T.iy.out):'',st.vatMode==='vat'?rw('Less: input VAT on purchases',T.im.inn,T.iy.inn):'',
   st.vatMode==='turnover'?rw('Turnover tax',T.im.tt,T.iy.tt):'',
   rw(st.vatMode==='vat'?'VAT payable to NBR':'Tax payable (VAT / turnover)',T.im.payable,T.iy.payable,1)].filter(Boolean))}
   <div class="note">Turnover tax is treated as a deductible business cost; with VAT-inclusive prices the VAT part is removed from profit. Confirm treatment and filing dates with your accountant.</div></div>`;
  h+=`<div class="card"><h2>2. Income tax estimate · ${fy.label} <span class="note">(July – June, ${T.el} month${T.el>1?'s':''} so far)</span></h2>${table(['BDT',['Amount','r']],[
   `<tr><td>Net profit before tax, year to date (from the profit table)</td><td class="r">${f0(T.P.fy.net)}</td></tr>`,
   `<tr><td>VAT / turnover tax adjustments</td><td class="r">${f0(T.iy.adj-T.iy.tt)}</td></tr>`,
   `<tr class="tot"><td>Profit before income tax, year to date</td><td class="r">${f0(T.ptb)}</td></tr>`,
   `<tr><td>${st.projection==='Yes'?'Annualised taxable profit (× 12 ÷ '+T.el+')':'Taxable profit used'}</td><td class="r">${f0(T.annual)}</td></tr>`].concat(
   T.parts.filter(x=>x.take>0).map(x=>`<tr><td class="note">&nbsp;&nbsp;${esc(x.lab)} · ${f0(x.take)} at ${x.rate}%</td><td class="r note">${f0(x.amt)}</td></tr>`),
   [`<tr><td>Full-year income tax${T.minApplied?' (minimum tax applied)':''}</td><td class="r">${f0(T.annualTax)}</td></tr>`,
    `<tr class="tot"><td>Income tax accrued to date</td><td class="r">${f0(T.ytdTax)}</td></tr>`,
    `<tr><td>Less: advance tax already paid / deducted</td><td class="r">${f0(n(st.aitPaid))}</td></tr>`,
    `<tr class="tot"><td>${T.balance>=0?'Still to provide for':'Credit / refundable'}</td><td class="r">${f0(Math.abs(T.balance))}</td></tr>`,
    `<tr class="tot"><td>Profit after income tax, year to date</td><td class="r">${f0(T.afterTax)}</td></tr>`]))}
   <div class="note">This is a planning estimate from your recorded data, not a tax return and not tax advice. Allowable expenses, depreciation, rebates, withholding credits and your personal income all change the real figure - confirm with a qualified accountant before filing. Rates live in the settings above because Bangladesh changes them in each budget.</div></div>`;
  if(feed){const ms=fy.list;const dRev=sum((feed.sales||[]).filter(x=>x.month===m),x=>n(x.revenue)),dCogs=sum((feed.sales||[]).filter(x=>x.month===m),x=>n(x.cogsDash));
    h+=`<div class="card"><h2>3. Check against the main dashboard · ${monLabel(m)}</h2>${table(['BDT',['Dashboard','r'],['This app (FIFO)','r']],[
     `<tr><td>Product sales revenue</td><td class="r">${f0(dRev)}</td><td class="r">${f0(T.P.month.rev)}</td></tr>`,
     `<tr><td>Cost of goods sold</td><td class="r">${f0(dCogs)}</td><td class="r">${f0(T.P.month.cogs)}</td></tr>`,
     `<tr class="tot"><td>Gross profit</td><td class="r">${f0(dRev-dCogs)}</td><td class="r">${f0(T.P.month.gp)}</td></tr>`])}
   <div class="note">Revenue should match. COGS can differ because the dashboard uses each product's stored cost while this app uses the actual FIFO purchase-lot cost - the gap is the costing difference you are controlling.</div></div>`;}
  return h;
}
function vSet(){
  const st=S.settings;
  let h=`<div class="card"><h2>Policy settings <span class="note">(partners decide)</span></h2><div class="frm">
   <div><label>Annual management capital rate (%)</label>${inp('setting',{f:'capRate'},st.capRate)}<div class="note">Illustrative 12% from the blueprint. Use actual borrowing cost where it exists; never add both.</div></div>
   <div><label>Non-moving threshold (days)</label>${inp('setting',{f:'nonMoving'},st.nonMoving)}</div>
   <div><label>Reorder-block threshold (days)</label>${inp('setting',{f:'block'},st.block)}</div>
   <div><label>Partner approval above write-down (BDT)</label>${inp('setting',{f:'approval'},st.approval)}</div>
   <div><label>Max stock cover for repeat orders (months)</label>${inp('setting',{f:'maxCover'},st.maxCover)}<div class="note">Orders that would push cover above this need partner approval.</div></div>
   <div><label>Inventory cost formula</label>${inp('setting',{f:'method'},st.method,'text')}<div class="note">Confirm with your accountant.</div></div></div>
   <h3>Ageing bands</h3>${table(['Band label','From (days)','Classification','Suggested response'],st.bands.map((b,i)=>`<tr><td>${inp('band',{i,f:'label'},b.label,'text')}</td><td>${inp('band',{i,f:'from'},b.from)}</td><td>${inp('band',{i,f:'cls'},b.cls,'text')}</td><td>${inp('band',{i,f:'resp'},b.resp,'text','w')}</td></tr>`))}</div>`;
  h+=`<div class="card"><h2>GitHub sync (private data repo)</h2><div class="note">Data stays on this device and is saved to your <b>private</b> repo as standard CSV files (one per table, opened directly in Excel or Google Sheets), in one commit. The token is kept only on this device and is never written into the data file. Create a fine-grained token with “Contents: read &amp; write” on the data repo only. Never put data in the public dashboard repo.</div>
   <div class="frm"><div><label>Owner</label>${inp('gh',{f:'owner'},GH.owner,'text')}</div><div><label>Repo</label>${inp('gh',{f:'repo'},GH.repo,'text')}</div><div><label>Folder in repo</label>${inp('gh',{f:'dir'},GH.dir,'text')}</div><div><label>Branch</label>${inp('gh',{f:'branch'},GH.branch,'text')}</div>
   <div><label>Token</label>${inp('gh',{f:'token'},GH.token,'password')}</div><div><label>Auto-push after changes</label>${sel('gh',{f:'auto'},GH.auto?'Yes':'No',['No','Yes'])}</div></div>
   <p><button class="btn" id="pushBtn">Push to GitHub</button> <button class="btn sec" id="pullBtn">Pull from GitHub</button></p></div>`;
  h+=`<div class="card"><h2>Data</h2><p><button class="btn sec" id="expBtn">Export backup (JSON)</button> <button class="btn sec" id="allCsvBtn">Download all CSV files</button> <label class="btn sec" style="display:inline-block;margin:0">Import backup<input type="file" id="impFile" accept=".json" hidden></label>
   <button class="btn gold" id="sampleBtn">Load sample data</button> <button class="btn del" id="resetBtn" style="padding:9px 14px;font-size:14px">Erase everything</button></p>
   <div class="note">Sample data is illustrative (including the 120 shirts at BDT 480 from the blueprint). Loading it replaces current data.</div></div>`;
  return h;
}

function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  $('#mSel').value=S.settings.month;
  const v={dashboard:vDashboard,move:vMove,cost:vCost,nrv:vNrv,setup:vSetup,buy:vBuy,review:vReview,act:vAct,tax:vTax,data:vData,set:vSet}[tab]();
  $('#app').innerHTML=v;setSync();writeSummary();
}
function softRender(){setTimeout(()=>{const a=document.activeElement,id=a&&a.dataset&&a.dataset.id;render();if(id){const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(el){el.focus();if(el.select&&el.type!=='date'&&el.type!=='password')try{el.select();}catch(e){}}}},120);}

// ---------- events ----------
function upsert(arr,pred,make){let x=arr.find(pred);if(!x){x=make();arr.push(x);}return x;}
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;if(!a)return;const d=t.dataset,m=S.settings.month,val=t.type==='checkbox'?t.checked:t.value;
  if(a==='mv'){const x=upsert(S.moves,y=>y.month===m&&y.lot===d.lot,()=>({month:m,lot:d.lot}));x[d.f]=val;}
  else if(a==='pool'){const x=upsert(S.pools,y=>y.month===m&&y.pool===d.p,()=>({month:m,pool:d.p}));x[d.f]=val;}
  else if(a==='drv'){const x=upsert(S.drivers,y=>y.month===m&&y.lot===d.lot,()=>({month:m,lot:d.lot}));x[d.f]=val;}
  else if(a==='nrv'){let x=S.nrv.find(y=>y.month===m&&y.lot===d.lot);if(!x){const c=nrvFor(d.lot,m);x=Object.assign({status:'Pending'},c||{},{month:m,lot:d.lot});S.nrv.push(x);}x[d.f]=val;}
  else if(a==='pur')S.purchases[+d.i][d.f]=val;
  else if(a==='dec')S.decisions[+d.i][d.f]=val;
  else if(a==='close'){upsert(S.close,y=>y.month===m,()=>({month:m}))[d.f]=val;}
  else if(a==='grid'){getArr(d.t)[+d.i][d.f]=val;}
  else if(a==='sku')S.skus[+d.i][d.f]=val;
  else if(a==='lot'){S.lots[+d.i][d.f]=val;}
  else if(a==='act')S.actions[+d.i][d.f]=val;
  else if(a==='band'){S.settings.bands[+d.i][d.f]=d.f==='from'?n(val):val;}
  else if(a==='setting')S.settings[d.f]=STRK.includes(d.f)?val:n(val);
  else if(a==='chk'){S.checks[m]=S.checks[m]||{};S.checks[m][d.s]=val;}
  else if(a==='gh'){GH[d.f]=d.f==='auto'?val==='Yes':val.trim();localStorage.setItem(GHKEY,JSON.stringify(GH));return;}
  else return;
  save();softRender();
});
document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return;}
  if(d.go){S.settings.month=d.go==='1'?nextM(S.settings.month):prevM(S.settings.month);save();render();return;}
  if(d.a==='delsku'){if(confirm('Delete this product?')){S.skus.splice(+d.i,1);save();render();}return;}
  if(d.a==='dellot'){const l=S.lots[+d.i];if(confirm('Delete lot '+l.ref+' and all its movements, drivers and NRV entries?')){S.moves=S.moves.filter(x=>x.lot!==l.ref);S.drivers=S.drivers.filter(x=>x.lot!==l.ref);S.nrv=S.nrv.filter(x=>x.lot!==l.ref);S.lots.splice(+d.i,1);save();render();}return;}
  if(d.a==='delpur'){if(confirm('Delete this request?')){S.purchases.splice(+d.i,1);save();render();}return;}
  if(d.a==='delact'){if(confirm('Delete this action?')){S.actions.splice(+d.i,1);save();render();}return;}
  if(d.a==='gdel'){if(confirm('Delete this row?')){getArr(gridTable).splice(+d.i,1);save();render();}return;}
  const id=t.id;
  if(id==='gridAdd'){const o={};SCHEMA[gridTable].cols.forEach(c=>{o[c[0]]=Array.isArray(c[2])?c[2][0]:(c[2]==='month'?S.settings.month:'');});getArr(gridTable).push(o);save();render();return;}
  if(id==='gridExp'||id==='allCsvBtn'){const fl=id==='gridExp'?{[SCHEMA[gridTable].file]:tableToCsv(gridTable)}:allFiles();Object.entries(fl).forEach(([nm,tx],k)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([tx],{type:'text/csv'}));a.download=nm;a.click();},k*250));return;}
  if(id==='zeroBtn'){const m=S.settings.month,R=report(m);R.infos.filter(i=>(i.open>0||i.received>0)&&!R.mv.find(x=>x.lot===i.ref)).forEach(i=>S.moves.push({month:m,lot:i.ref,sales:0,retIn:0,retOut:0,other:0,count:'',revenue:0}));save();render();}
  else if(id==='copyPools'){const m=S.settings.month,p=prevM(m);S.pools.filter(x=>x.month===p).forEach(x=>{if(!S.pools.find(y=>y.month===m&&y.pool===x.pool))S.pools.push(Object.assign({},x,{month:m}));});save();render();}
  else if(id==='copyDrv'){const m=S.settings.month,p=prevM(m);S.drivers.filter(x=>x.month===p).forEach(x=>{if(!S.drivers.find(y=>y.month===m&&y.lot===x.lot))S.drivers.push(Object.assign({},x,{month:m}));});save();render();}
  else if(id==='impBtn')doImport(false);else if(id==='impRemoteBtn')doImport(true);
  else if(id==='pushBtn')ghPush(false);else if(id==='pullBtn'){if(confirm('Replace data on this device with the GitHub copy?'))ghPull(false);}
  else if(id==='expBtn'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wrappdeal-inventory-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
  else if(id==='sampleBtn'){if(confirm('Replace current data with sample data?')){S=sampleData();save();tab='dashboard';render();}}
  else if(id==='resetBtn'){if(confirm('Erase ALL inventory data on this device? Export a backup first.')&&confirm('Really erase everything?')){S=blank();save();render();}}
  else if(id==='csvBtn')exportCsv();
});
document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();const o=Object.fromEntries(new FormData(f));
  if(k==='sku'){o.code=o.code.trim();if(S.skus.find(s=>s.code===o.code)){alert('SKU code already exists.');return;}S.skus.push({code:o.code,name:o.name.trim(),category:o.category,supplier:o.supplier,unit:o.unit,active:'Yes',reorder:o.reorder,max:o.max,markPrice:o.markPrice,sellPrice:o.sellPrice});}
  else if(k==='lot'){o.ref=o.ref.trim();if(S.lots.find(l=>l.ref===o.ref)){alert('Lot ref already exists.');return;}if(!S.skus.length){alert('Add a product first.');return;}
    S.lots.push({ref:o.ref,date:o.date,sku:o.sku,qty:n(o.qty),price:n(o.price),landed:n(o.landed),preOut:n(o.preOut),doc:o.doc});}
  else if(k==='pur'){const id='PR-'+String(S.purchases.length+1).padStart(3,'0');S.purchases.push({id,date:new Date().toISOString().slice(0,10),sku:o.sku,qty:n(o.qty),price:o.price,lead:o.lead,moq:o.moq,reason:o.reason,status:'Requested',approver:''});}
  else if(k==='act'){const id='A-'+String(S.actions.length+1).padStart(3,'0');S.actions.push({id,raised:new Date().toISOString().slice(0,10),target:o.target,issue:o.issue,action:o.action,owner:o.owner,due:o.due,status:'Open',cleared:'',expected:o.expected,proceeds:''});}
  save();render();
});
document.addEventListener('input',e=>{
  const f=e.target.form;if(f&&f.id==='lotForm'){const q=n(f.qty.value),p=n(f.price.value),l=n(f.landed.value);$('#lotPrev').textContent=q>0?`Unit landed cost: BDT ${f2(p+l/q)} · lot cost BDT ${f0(q*p+l)}`:'Unit landed cost = unit price + landed costs ÷ quantity.';}
});
$('#mSel').addEventListener('change',e=>{if(e.target.value){S.settings.month=e.target.value;save();render();}});
document.addEventListener('change',e=>{
  if(e.target.id==='gridSel'){gridTable=e.target.value;render();return;}
  if(e.target.id==='gridImp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const a=csvToTable(gridTable,r.result);if(confirm('Replace '+SCHEMA[gridTable].title+' with '+a.length+' rows from '+f.name+'?')){if(gridTable==='bands'&&!a.length){alert('Bands cannot be empty.');return;}setArr(gridTable,gridTable==='bands'?a.map(b=>Object.assign(b,{from:n(b.from)})):a);save();render();}};r.readAsText(f);}
});
document.addEventListener('change',e=>{if(e.target.id==='impFile'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,d.settings);save();render();alert('Backup imported.');}catch(x){alert('Not a valid backup file.');}};r.readAsText(e.target.files[0]);}});
function exportCsv(){
  const m=S.settings.month,R=report(m);
  const rows=[['WrappDeal inventory report',m],[],['Measure','BDT'],['Closing inventory at cost',R.closeVal],['NRV write-down',R.wd],['Carrying value',R.closeVal-R.wd],['Holding cost (month)',R.hold],['Holding cost (cumulative)',R.cum],['Actual financing',R.fin],['Capital blockage (est.)',R.cap],['Non-moving value',R.nonMovVal],[],
   ['Lot','SKU','Qty','Unit cost','Value','Age days','Band','Write-down']];
  R.stock.forEach(i=>rows.push([i.ref,i.sku,i.close,i.uc,i.closeVal,i.age,S.settings.bands[i.band].label,R.nrv[i.ref].wd]));
  const csv=rows.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='wrappdeal-inventory-'+m+'.csv';a.click();
}
loadLocal();autoImport();render();
if(GH.token&&localStorage.getItem(DIRTY)!=='1')ghPull(true).then(autoImport);
</script>
