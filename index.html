<body>
<header>
  <h1>WrappDeal</h1>
  <p>Wrap Your Best Deal · Business Dashboard</p>
  <button id="lockbtn" onclick="lockNow()">🔒 লক</button>
  <button id="syncpill" onclick="go('settings')">⚪ লোকাল</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="lock"><div class="box"><h1 style="margin:0 0 4px;font-family:Georgia,serif;color:#167A6E">WrappDeal</h1><p class="muted" style="margin:0 0 16px">🔒 পাসওয়ার্ড দিয়ে আনলক করুন</p>
<input id="lockpw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryUnlock()"><p id="lockerr" class="neg" style="min-height:22px"></p><button class="btn" style="width:100%" onclick="tryUnlock()">আনলক</button></div></div>
<div id="printarea"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
"use strict";
/* ============ helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num = v => { const n = parseFloat(v); return isFinite(n)?n:0; };
const money = n => "৳ "+num(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "৳ "+Math.round(num(n)).toLocaleString("en-US");
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const today = ()=>iso(new Date());
const dmy = s => s? s.split("-").reverse().join("-") : "";
const addDays = (s,n)=>{ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const monthOf = s => s.slice(0,7);
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",2600); }

/* ============ state & storage ============ */
const STATUSES = ["Pending","Confirmed","Shipped","Delivered","Returned","Cancelled"];
const STATUS_BN = {Pending:"পেন্ডিং",Confirmed:"কনফার্ম",Shipped:"শিপড",Delivered:"ডেলিভারড",Returned:"রিটার্ন",Cancelled:"বাতিল"};
const CHANNELS = ["Facebook","WhatsApp","Phone","Walk-in","Other"];
const PAY = {COD:"ক্যাশ / COD",MFS:"MFS (মোবাইল ব্যাংকিং)",Bank:"Bank Transfer"};
const MFS_LIST = ["bKash","Nagad","Rocket"];
const ADV_METHODS = ["Cash","bKash","Nagad","Rocket","Bank Transfer"];
const payM = o => o.payMethod||"COD";
const payLabel = o => payM(o)==="MFS" ? "MFS · "+(o.mfsProvider||"") : payM(o)==="Bank" ? "Bank Transfer" : "COD";
const EXP_CATS = ["Packaging materials","Courier / Delivery","Ads / Boost","Salary","Rent / Utilities","Transport","Other"];
const blank = ()=>({v:1,products:[],orders:[],purchases:[],expenses:[],ledger:[],mfs:[],quotes:[],opening:{Cash:0,bKash:0,Nagad:0,Rocket:0,Bank:0},updated:null});
let S = blank();
let GH = JSON.parse(localStorage.getItem("wd_gh")||"{}");           // {owner,repo,branch,path,token | tokenEnc}
let META = JSON.parse(localStorage.getItem("wd_meta")||'{"sha":null,"dirty":false}');
let SEC = JSON.parse(localStorage.getItem("wd_sec")||"null");        // {salt, verifier} when password protection is on
let KEY = null;                                                       // AES key, memory only
const readStored = ()=>{ try{ return JSON.parse(localStorage.getItem("wd_data")||"null"); }catch(e){ return null; } };
{ const st=readStored(); if(st&&!st.enc) S=Object.assign(blank(),st); }
const ghReady = ()=>GH.owner&&GH.repo&&GH.token;

/* ---- crypto: PBKDF2 (SHA-256, 310k) -> AES-256-GCM ---- */
const toB64 = u8 => { let r=""; u8.forEach(x=>r+=String.fromCharCode(x)); return btoa(r); };
const fromB64 = b => Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(saltB64),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encStr(str,k=KEY){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(str)); return {iv:toB64(iv),ct:toB64(new Uint8Array(ct))}; }
async function decStr(o,k=KEY){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(o.iv)},k,fromB64(o.ct)); return new TextDecoder().decode(pt); }
async function persist(){ writeFeed(); if(KEY){ const o=await encStr(JSON.stringify(S)); localStorage.setItem("wd_data",JSON.stringify({enc:1,...o})); } else localStorage.setItem("wd_data",JSON.stringify(S)); }
async function persistGH(){ const g={...GH}; if(KEY&&g.token){ g.tokenEnc=await encStr(g.token); delete g.token; } localStorage.setItem("wd_gh",JSON.stringify(g)); }
async function packData(){ if(!KEY) return JSON.stringify(S,null,1); const o=await encStr(JSON.stringify(S)); return JSON.stringify({enc:1,v:2,salt:SEC.salt,...o}); }
async function adoptKey(k,salt){ KEY=k; SEC={salt,verifier:await encStr("wrappdeal-ok")}; localStorage.setItem("wd_sec",JSON.stringify(SEC)); await persistGH(); await persist(); $("#lockbtn").style.display="inline-block"; resetIdle(); }
async function openRemote(r){      // returns plain data object, or null if password missing/wrong
  if(!r.enc) return r;
  if(KEY&&SEC&&r.salt===SEC.salt){ try{ return JSON.parse(await decStr(r)); }catch(e){ return null; } }
  const pw=await askPassword(KEY?"অন্য ডিভাইসে পাসওয়ার্ড বদলানো হয়েছে। নতুন পাসওয়ার্ড দিন":"GitHub-এর ডেটা এনক্রিপ্টেড। পাসওয়ার্ড দিন");
  if(!pw) return null;
  try{ const k=await deriveKey(pw,r.salt); const plain=JSON.parse(await decStr(r,k)); await adoptKey(k,r.salt); return plain; }
  catch(e){ alert("পাসওয়ার্ড ভুল"); return null; }
}
function askPassword(msg){ return new Promise(res=>{ const m=document.createElement("div"); m.className="modal"; m.style.zIndex=400;
  m.innerHTML=`<div class="box" style="max-width:400px"><h3 style="margin-top:0">🔒 পাসওয়ার্ড</h3><p class="muted">${esc(msg)}</p><input id="apw" type="password" autocomplete="current-password"><div class="row" style="margin-top:14px"><button class="btn" id="aok">ঠিক আছে</button><button class="btn gray" id="acn">বাতিল</button></div></div>`;
  document.body.appendChild(m); const i=m.querySelector("#apw"); i.focus(); const done=v=>{ m.remove(); res(v); };
  m.querySelector("#aok").onclick=()=>done(i.value); m.querySelector("#acn").onclick=()=>done(null); i.onkeydown=e=>{ if(e.key==="Enter") done(i.value); }; }); }

/* ---- lock screen, auto-lock ---- */
let fails=0, waitUntil=0, skipUnload=false, idleT=null;
function showLock(){ $("#lock").style.display="flex"; setTimeout(()=>$("#lockpw").focus(),50); }
async function tryUnlock(){
  const err=$("#lockerr"); if(Date.now()<waitUntil){ err.textContent="একটু অপেক্ষা করুন…"; return; }
  err.textContent="যাচাই হচ্ছে…";
  try{ KEY=await deriveKey($("#lockpw").value,SEC.salt); if(await decStr(SEC.verifier)!=="wrappdeal-ok") throw 0; }
  catch(e){ KEY=null; fails++; waitUntil=Date.now()+Math.min(30000,1000*Math.pow(2,fails)); err.textContent="পাসওয়ার্ড ভুল"; $("#lockpw").value=""; return; }
  try{ const st=readStored(); if(st&&st.enc) S=Object.assign(blank(),JSON.parse(await decStr(st))); if(GH.tokenEnc) GH.token=await decStr(GH.tokenEnc); }
  catch(e){ KEY=null; err.textContent="ডেটা খোলা যায়নি"; return; }
  $("#lockpw").value=""; err.textContent=""; $("#lock").style.display="none"; $("#lockbtn").style.display="inline-block"; resetIdle(); boot();
}
function lockNow(){ skipUnload=true; location.reload(); }
function resetIdle(){ clearTimeout(idleT); if(KEY) idleT=setTimeout(lockNow,10*60*1000); }
["click","keydown","touchstart","mousemove"].forEach(e=>addEventListener(e,resetIdle,{passive:true}));

function setPasswordUI(change){
  openModal(`<h3 style="margin-top:0">${change?"পাসওয়ার্ড বদলান":"🔐 পাসওয়ার্ড সুরক্ষা চালু করুন"}</h3>
  <p class="muted" style="margin-top:0">ডেটা ও GitHub টোকেন AES-256 দিয়ে এনক্রিপ্ট হবে। <b>পাসওয়ার্ড ভুলে গেলে ডেটা উদ্ধার করা যাবে না</b> — আগে একটি JSON ব্যাকআপ নিয়ে রাখুন।</p>
  ${change?`<label>বর্তমান পাসওয়ার্ড</label><input id="pw0" type="password" autocomplete="current-password" style="margin-bottom:10px">`:""}
  <label>নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="pw1" type="password" autocomplete="new-password" style="margin-bottom:10px">
  <label>আবার লিখুন</label><input id="pw2" type="password" autocomplete="new-password"><p id="pwerr" class="neg" style="min-height:20px"></p>
  <div class="row"><button class="btn" onclick="doSetPassword(${change?"true":"false"})">✓ সেভ</button><button class="btn gray" onclick="closeModal()">বাতিল</button></div>`);
}
async function doSetPassword(change){
  const p1=$("#pw1").value, p2=$("#pw2").value, err=$("#pwerr");
  if(change){ try{ const k0=await deriveKey($("#pw0").value,SEC.salt); await decStr(SEC.verifier,k0); }catch(e){ err.textContent="বর্তমান পাসওয়ার্ড ভুল"; return; } }
  if(p1.length<8){ err.textContent="কমপক্ষে ৮ অক্ষর দিন"; return; }
  if(p1!==p2){ err.textContent="দুটি পাসওয়ার্ড মেলেনি"; return; }
  err.textContent="কাজ চলছে…";
  const salt=toB64(crypto.getRandomValues(new Uint8Array(16)));
  await adoptKey(await deriveKey(p1,salt),salt);

/* ============ Link to Inventory Costing (same-origin feed, no customer data) ============ */
function buildFeed(){
  const code=pid=>{const p=S.products.find(p=>p.id===pid);return p?p.code:null;};
  const sales={},mon={},exp={};let unmapped=0;
  const mm=d=>String(d||"").slice(0,7);
  S.orders.filter(counts).forEach(o=>{
    const m=mm(o.date); if(!m) return;
    const itT=orderItemsTotal(o)||1, disc=num(o.discount);
    o.items.forEach(i=>{
      const c=code(i.pid); if(!c){unmapped++;return;}
      const k=m+"|"+c, line=num(i.qty)*num(i.price), rev=line-disc*line/itT;
      const r=sales[k]||(sales[k]={month:m,code:c,qty:0,revenue:0,cogsDash:0});
      r.qty+=num(i.qty); r.revenue+=rev; r.cogsDash+=num(i.qty)*num(i.cost);
    });
    const x=mon[m]||(mon[m]={month:m,delivery:0,courier:0,orders:0});
    x.delivery+=num(o.delivery); x.courier+=num(o.courierCost); x.orders++;
  });
  S.expenses.forEach(e=>{ const m=mm(e.date); if(!m) return; const k=m+"|"+e.category; const r=exp[k]||(exp[k]={month:m,cat:e.category,amount:0}); r.amount+=num(e.amount); });
  const r2=x=>Math.round(x*100)/100;
  return {v:1,updated:S.updated||null,unmapped,
    products:S.products.map(p=>({code:p.code,name:p.name,category:p.category||"",cost:num(p.cost),price:num(p.price),stock:num(p.stock)})),
    purchases:S.purchases.map(u=>({date:u.date,code:code(u.pid)||"",name:u.name||"",qty:num(u.qty),cost:num(u.cost)})),
    sales:Object.values(sales).map(r=>({...r,revenue:r2(r.revenue),cogsDash:r2(r.cogsDash)})),
    monthly:Object.values(mon), expenses:Object.values(exp).map(r=>({...r,amount:r2(r.amount)}))};
}
let feedPushTimer=null;
function writeFeed(){
  try{ if(!S.products.length&&!S.orders.length) return; const f=buildFeed(); localStorage.setItem("wd_feed_v1",JSON.stringify(f));
    if(typeof ghReady==="function"&&ghReady()){ clearTimeout(feedPushTimer); feedPushTimer=setTimeout(()=>pushFeed(f),4000); } }catch(e){ console.error("feed",e); }
}
async function pushFeed(f){
  try{
    const txt=JSON.stringify(f), h=Array.from(txt).reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
    if(localStorage.getItem("wd_feed_hash")===String(h)) return;
    const u=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/inventory/dashboard_feed.json`;
    const g=await fetch(u+"?ref="+encodeURIComponent(GH.branch||"main")+"&t="+Date.now(),{headers:ghHead()});
    const body={message:"Dashboard feed for inventory costing",content:b64e(txt),branch:GH.branch||"main"};
    if(g.ok) body.sha=(await g.json()).sha;
    const r=await fetch(u,{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok) localStorage.setItem("wd_feed_hash",String(h));
  }catch(e){ console.error("feed push",e); }
}

/* ============ GitHub sync (Contents API) ============ */
const b64e = s => { const b=new TextEncoder().encode(s); let r=""; b.forEach(x=>r+=String.fromCharCode(x)); return btoa(r); };
const b64d = s => { const r=atob(s.replace(/\n/g,"")); const b=Uint8Array.from(r,c=>c.charCodeAt(0)); return new TextDecoder().decode(b); };
const ghUrl = ()=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path||"wrappdeal-data.json"}`;
const ghHead = ()=>({Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function pill(cls,txt){ const p=$("#syncpill"); p.className=cls; p.textContent=txt; }
function setStatus(){
  if(!ghReady()) return pill("","⚪ লোকাল (GitHub সংযোগ নেই)");
  pill(META.dirty?"busy":"ok", META.dirty?"🟡 সেভ বাকি":"🟢 GitHub-এ সেভড");
}
let syncTimer=null, syncing=false;
function scheduleSync(){ setStatus(); if(!ghReady()) return; clearTimeout(syncTimer); syncTimer=setTimeout(push,1500); }

async function pull(){
  if(!ghReady()) return;
  pill("busy","🔄 লোড হচ্ছে…");
  try{
    const r=await fetch(ghUrl()+"?ref="+encodeURIComponent(GH.branch||"main")+"&t="+Date.now(),{headers:ghHead()});
    if(r.status===404){ META.sha=null; toast("GitHub-এ ফাইল নেই — প্রথম সেভে তৈরি হবে"); if(META.dirty||S.orders.length||S.products.length) await push(); else setStatus(); return; }
    if(!r.ok) throw new Error(r.status+" "+(await r.json().catch(()=>({}))).message);
    const j=await r.json();
    if(j.sha===META.sha && !META.dirty){ setStatus(); return; }
    if(j.sha===META.sha && META.dirty){ await push(); return; }   // unsynced local changes: push, never overwrite
    let remote; if(j.content){ remote=JSON.parse(b64d(j.content)); }
    else { const raw=await fetch(j.download_url||j.git_url,{headers:ghHead()}); remote=await raw.json(); }
    remote=await openRemote(remote); if(!remote){ pill("err","🔴 পাসওয়ার্ড লাগবে"); return; }
    if(META.dirty && j.sha!==META.sha){
      if(!confirm("GitHub-এ নতুন ডেটা আছে এবং এই ডিভাইসেও সেভ-না-হওয়া পরিবর্তন আছে।\n\nOK = GitHub-এর ডেটা নিন\nCancel = এই ডিভাইসের ডেটা রাখুন (GitHub ওভাররাইট হবে)")){ META.sha=j.sha; await push(); return; }
    }
    S=Object.assign(blank(),remote); META.sha=j.sha; META.dirty=false;
    await persist(); localStorage.setItem("wd_meta",JSON.stringify(META));
    setStatus(); render(); toast("GitHub থেকে ডেটা লোড হয়েছে");
  }catch(e){ pill("err","🔴 সিঙ্ক ত্রুটি"); console.error(e); toast("সিঙ্ক ত্রুটি: "+e.message); }
}
async function push(){
  if(!ghReady()||syncing) return; syncing=true; pill("busy","🔄 সেভ হচ্ছে…");
  try{
    const body={message:"WrappDeal data update "+new Date().toISOString(),content:b64e(await packData()),branch:GH.branch||"main"};
    if(META.sha) body.sha=META.sha;
    const r=await fetch(ghUrl(),{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ syncing=false; META.sha=null; // sha stale: refetch sha then retry once
      const g=await fetch(ghUrl()+"?ref="+encodeURIComponent(GH.branch||"main")+"&t="+Date.now(),{headers:ghHead()});
      if(g.ok){ META.sha=(await g.json()).sha; return push(); } throw new Error("conflict "+r.status); }
    if(!r.ok) throw new Error(r.status+" "+(await r.json().catch(()=>({}))).message);
    META.sha=(await r.json()).content.sha; META.dirty=false;
    localStorage.setItem("wd_meta",JSON.stringify(META)); setStatus();
  }catch(e){ pill("err","🔴 সেভ ব্যর্থ — আবার চেষ্টা"); console.error(e); toast("GitHub সেভ ব্যর্থ: "+e.message); }
  syncing=false;
}

/* ============ business logic ============ */
const orderItemsTotal = o => o.items.reduce((s,i)=>s+num(i.qty)*num(i.price),0);
const orderTotal = o => orderItemsTotal(o)+num(o.delivery)-num(o.discount);
const orderDue   = o => payM(o)==="COD" ? orderTotal(o)-num(o.advance) : 0;   // MFS / Bank = paid upfront
const orderProfit= o => o.items.reduce((s,i)=>s+num(i.qty)*(num(i.price)-num(i.cost)),0)-num(o.discount)+num(o.delivery)-num(o.courierCost);
const counts = o => o.status!=="Cancelled" && o.status!=="Returned";   // counts as a sale
const restores = st => st==="Cancelled"||st==="Returned";
function stockApply(o,sign){ o.items.forEach(i=>{ const p=S.products.find(p=>p.id===i.pid); if(p) p.stock=num(p.stock)+sign*num(i.qty); }); }
const productById = id => S.products.find(p=>p.id===id);
const ACCS=["Cash","bKash","Nagad","Rocket","Bank"];
const ACC_BN={Cash:"ক্যাশ",bKash:"bKash",Nagad:"Nagad",Rocket:"Rocket",Bank:"ব্যাংক"};
const advAcc = m => m==="Bank Transfer"?"Bank":(ACCS.includes(m)?m:"Cash");

function migrate(){
  S.ledger=S.ledger||[]; S.mfs=S.mfs||[]; S.quotes=S.quotes||[]; S.biz=S.biz||{};
  S.opening=Object.assign({Cash:0,bKash:0,Nagad:0,Rocket:0,Bank:0},S.opening||{});
  let n=S.products.reduce((m,p)=>{ const x=/^P(\d+)$/.exec(p.code||""); return x?Math.max(m,+x[1]):m; },0);
  S.products.forEach(p=>{ if(!p.code) p.code="P"+String(++n).padStart(4,"0"); });
}
function nextInvoice(date){
  const d=date.replace(/-/g,""); const n=S.orders.filter(o=>o.inv&&o.inv.includes("-"+d+"-")).length+1;
  return `INV-${d}-${String(n).padStart(4,"0")}`;
}
function sums(from,to){
  const os=S.orders.filter(o=>counts(o)&&o.date>=from&&o.date<=to);
  const ex=S.expenses.filter(e=>e.date>=from&&e.date<=to);
  const mf=S.mfs.filter(x=>x.type==="sale"&&x.date>=from&&x.date<=to).reduce((s,x)=>s+num(x.charge),0);
  const sales=os.reduce((s,o)=>s+orderTotal(o),0), profit=os.reduce((s,o)=>s+orderProfit(o),0), exp=ex.reduce((s,e)=>s+num(e.amount),0);
  return {sales,profit,exp,mfs:mf,net:profit+mf-exp,count:os.length};
}

/* ---- unified account ledger (computed from everything; nothing stored twice) ---- */
function movements(){
  const m=[];
  S.orders.filter(counts).forEach(o=>{
    const t=orderTotal(o), pm=payM(o);
    if(pm==="MFS") m.push({date:o.date,acc:MFS_LIST.includes(o.mfsProvider)?o.mfsProvider:"bKash",amt:t,desc:"বিক্রয় "+o.inv,src:"sale"});
    else if(pm==="Bank") m.push({date:o.date,acc:"Bank",amt:t,desc:"বিক্রয় "+o.inv,src:"sale"});
    else{
      const adv=num(o.advance); if(adv>0) m.push({date:o.date,acc:advAcc(o.advMethod),amt:adv,desc:"পরিশোধ/অগ্রিম "+o.inv,src:"sale"});
      if(o.status==="Delivered"){ const due=t-adv; if(due>0) m.push({date:o.date,acc:"Cash",amt:due,desc:"COD আদায় "+o.inv,src:"sale"}); }
    }
  });
  S.purchases.forEach(x=>{ if(num(x.paid)>0) m.push({date:x.date,acc:x.acc||"Cash",amt:-num(x.paid),desc:"ক্রয় — "+x.name,src:"purchase"}); });
  S.expenses.forEach(e=>m.push({date:e.date,acc:e.acc||"Cash",amt:-num(e.amount),desc:"খরচ — "+e.category+(e.note?" ("+e.note+")":""),src:"expense"}));
  S.mfs.forEach(x=>{
    const a=num(x.amount), c=num(x.charge);
    if(x.type==="buy"){ m.push({date:x.date,acc:"Cash",amt:-a,desc:"MFS ক্রয় "+x.provider,src:"mfs"}); m.push({date:x.date,acc:x.provider,amt:a,desc:"MFS ক্রয় (ক্যাশ দিয়ে)",src:"mfs"}); }
    else { m.push({date:x.date,acc:x.provider,amt:-a,desc:"MFS বিক্রয় "+(x.phone||""),src:"mfs"}); m.push({date:x.date,acc:"Cash",amt:a+c,desc:"MFS বিক্রয় "+x.provider+(c?" (চার্জসহ)":""),src:"mfs"}); }
  });
  S.ledger.forEach(x=>m.push({date:x.date,acc:x.acc,amt:num(x.amt),desc:x.note||"ম্যানুয়াল এন্ট্রি",src:"manual",id:x.id}));
  return m;
}
function balances(){
  const b={}; ACCS.forEach(a=>b[a]=num(S.opening[a])); movements().forEach(x=>{ b[x.acc]=(b[x.acc]||0)+x.amt; }); return b;
}

/* ============ Charts (plain SVG, hover tooltips) ============ */
function lineChart(el,labels,series){
  const W=620,H=250,L=52,R=14,T=12,B=28, n=labels.length;
  const mx=Math.max(1,...series.flatMap(s=>s.vals)), mn=Math.min(0,...series.flatMap(s=>s.vals));
  const nice=(v)=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}; const top=nice(mx);
  const X=i=>L+(n<2?0:i*(W-L-R)/(n-1)), Y=v=>T+(H-T-B)*(1-(v-mn)/(top-mn));
  let g=""; for(let k=0;k<=4;k++){ const v=mn+(top-mn)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?Math.round(v/100)/10+"k":Math.round(v)}</text>`; }
  const step=Math.max(1,Math.ceil(n/6)); labels.forEach((d,i)=>{ if(i%step===0||i===n-1) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.slice(8)}/${d.slice(5,7)}</text>`; });
  const paths=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.vals.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales and profit line chart">${g}${paths}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><g id="dots"></g></svg><div class="tip"></div>
  <details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">ডেটা টেবিল</summary><div class="tablewrap" style="max-height:180px;overflow:auto"><table>${labels.map((d,i)=>`<tr><td>${dmy(d)}</td>${series.map(s=>`<td class="num">${money(s.vals[i])}</td>`).join("")}</tr>`).reverse().join("")}</table></div></details>`;
  const svg=el.querySelector("svg"), tip=el.querySelector(".tip"), cx=el.querySelector("#cx"), dots=el.querySelector("#dots");
  svg.addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*W; let i=Math.round((px-L)/((W-L-R)/Math.max(1,n-1))); i=Math.max(0,Math.min(n-1,i));
    cx.setAttribute("x1",X(i)); cx.setAttribute("x2",X(i)); cx.style.display="";
    dots.innerHTML=series.map(s=>`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join("");
    tip.style.display="block"; tip.innerHTML=`<b>${dmy(labels[i])}</b><br>`+series.map(s=>`${s.name}: ${money(s.vals[i])}`).join("<br>");
    const tx=X(i)/W*r.width; tip.style.left=Math.min(tx+12,r.width-150)+"px"; tip.style.top="8px"; });
  svg.addEventListener("mouseleave",()=>{ tip.style.display="none"; cx.style.display="none"; dots.innerHTML=""; });
}
function donut(el,data){
  if(!data.length){ el.innerHTML=empty("এই মাসে কোনো খরচ নেই"); return; }
  const cols=["var(--s1)","var(--s2)","var(--s4)","var(--s5)","var(--s6)","var(--muted)"];
  if(data.length>5){ const rest=data.slice(5).reduce((s,d)=>s+d[1],0); data=[...data.slice(0,5),["Other",rest]]; }
  const tot=data.reduce((s,d)=>s+d[1],0), R=70, C=2*Math.PI*R; let off=0;
  const arcs=data.map((d,i)=>{ const len=d[1]/tot*C; const s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="30" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" data-i="${i}"><title>${esc(d[0])}: ${money(d[1])} (${Math.round(d[1]/tot*100)}%)</title></circle>`; off+=len; return s; }).join("");
  el.innerHTML=`<div class="row" style="align-items:center;gap:20px"><svg viewBox="0 0 200 200" width="190" role="img" aria-label="Expenses donut">${arcs}<text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--muted)">মোট খরচ</text><text x="100" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${money0(tot)}</text></svg>
  <div class="legend" style="flex-direction:column;gap:8px">${data.map((d,i)=>`<span><i style="background:${cols[i]}"></i>${esc(d[0])} — ${money0(d[1])} (${Math.round(d[1]/tot*100)}%)</span>`).join("")}</div></div>`;
}

let draft=null;
function orderForm(id){
  const ex=S.orders.find(o=>o.id===id); if(!ex) return;
  draft=JSON.parse(JSON.stringify(ex));
  draft.payMethod=draft.payMethod||"COD"; draft.mfsProvider=draft.mfsProvider||"bKash"; draft.payRef=draft.payRef||""; draft.advMethod=draft.advMethod||"Cash";
  draft._isNew=false; draft._old=JSON.parse(JSON.stringify(ex));
  drawOrderForm();
}
function drawOrderForm(){
  const d=draft;
  openModal(`<h3 style="margin-top:0">অর্ডার এডিট — ${esc(d.inv)}</h3>
  <div class="f" style="margin-bottom:12px"><div><label>তারিখ</label><input type="date" value="${d.date}" oninput="draft.date=this.value"></div>
   <div><label>কাস্টমার</label><input value="${esc(d.customer)}" oninput="draft.customer=this.value"></div>
   <div><label>ফোন</label><input value="${esc(d.phone)}" oninput="draft.phone=this.value"></div>
   <div><label>চ্যানেল</label><select oninput="draft.channel=this.value">${CHANNELS.map(c=>`<option ${d.channel===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
  <div style="margin-bottom:12px"><label>ঠিকানা</label><input value="${esc(d.address||"")}" oninput="draft.address=this.value"></div>
  <label>পণ্য</label><div id="items">${d.items.map((it,i)=>`<div class="line-item">
    <div><select onchange="pickProduct(${i},this.value)"><option value="">— পণ্য বাছুন / কাস্টম —</option>${S.products.map(p=>`<option value="${p.id}" ${it.pid===p.id?"selected":""}>${esc(p.name)} (স্টক ${p.stock})</option>`).join("")}</select>
      ${it.pid?"":`<input style="margin-top:6px" placeholder="কাস্টম পণ্যের নাম" value="${esc(it.name)}" oninput="draft.items[${i}].name=this.value">`}</div>
    <div><label>পরিমাণ</label><input type="number" min="1" value="${it.qty}" oninput="draft.items[${i}].qty=num(this.value);calcDraft()"></div>
    <div><label>বিক্রয় দাম</label><input type="number" value="${it.price}" oninput="draft.items[${i}].price=this.value;calcDraft()"></div>
    <div><label>ক্রয় দাম</label><input type="number" value="${it.cost}" oninput="draft.items[${i}].cost=this.value;calcDraft()"></div>
    <button class="btn sm red" onclick="draft.items.splice(${i},1);drawOrderForm()">✕</button></div>`).join("")}</div>
  <button class="btn blue sm" onclick="draft.items.push({pid:'',name:'',qty:1,price:'',cost:0});drawOrderForm()">＋ আরেকটি পণ্য</button>
  <div class="f" style="margin:14px 0"><div><label>ডেলিভারি চার্জ (কাস্টমার)</label><input type="number" value="${d.delivery}" oninput="draft.delivery=this.value;calcDraft()"></div>
   <div><label>ডিসকাউন্ট</label><input type="number" value="${d.discount}" oninput="draft.discount=this.value;calcDraft()"></div>
   ${payFields(d)}
   <div><label>কুরিয়ার</label><input value="${esc(d.courier)}" oninput="draft.courier=this.value"></div>
   <div><label>কুরিয়ার খরচ (আমাদের)</label><input type="number" value="${d.courierCost}" oninput="draft.courierCost=this.value;calcDraft()"></div>
   <div><label>স্ট্যাটাস</label><select oninput="draft.status=this.value">${STATUSES.map(s=>`<option value="${s}" ${d.status===s?"selected":""}>${STATUS_BN[s]}</option>`).join("")}</select></div></div>
  <div><label>নোট</label><input value="${esc(d.note||"")}" oninput="draft.note=this.value"></div>
  <div id="calc" class="card" style="background:#e8f5f2;margin:14px 0"></div>
  <div class="row"><button class="btn" onclick="saveOrder()">✓ সেভ করুন</button><button class="btn gray" onclick="closeModal()">বাতিল</button></div>`);
  calcDraft();
}
function payFields(d){
  let h=`<div><label>পেমেন্ট মাধ্যম</label><select onchange="draft.payMethod=this.value;drawOrderForm()">${Object.entries(PAY).map(([k,v])=>`<option value="${k}" ${d.payMethod===k?"selected":""}>${v}</option>`).join("")}</select></div>`;
  if(d.payMethod==="MFS") h+=`<div><label>MFS সার্ভিস</label><select oninput="draft.mfsProvider=this.value">${MFS_LIST.map(x=>`<option ${d.mfsProvider===x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>ট্রানজেকশন আইডি (TrxID)</label><input value="${esc(d.payRef)}" oninput="draft.payRef=this.value"></div>`;
  else if(d.payMethod==="Bank") h+=`<div><label>ব্যাংক রেফারেন্স / ট্রান্সফার আইডি</label><input value="${esc(d.payRef)}" oninput="draft.payRef=this.value"></div>`;
  else h+=`<div><label>অগ্রিম পেমেন্ট (৳)</label><input type="number" value="${d.advance}" oninput="draft.advance=this.value;calcDraft()"></div><div><label>অগ্রিম কীভাবে নিয়েছেন</label><select oninput="draft.advMethod=this.value">${ADV_METHODS.map(x=>`<option ${d.advMethod===x?"selected":""}>${x}</option>`).join("")}</select></div>`;
  return h;
}
function pickProduct(i,pid){ const p=productById(pid), it=draft.items[i]; it.pid=pid; if(p){ it.name=p.name; it.price=p.price; it.cost=p.cost; it.code=p.code; } drawOrderForm(); }
function calcDraft(){ const d=draft, tot=orderTotal(d), el=$("#calc"); if(!el) return;
  el.innerHTML=`<div class="row"><div class="sp">মোট বিল: <b>${money(tot)}</b></div><div class="sp">COD বাকি: <b>${money(orderDue(d))}</b></div><div class="sp">আনুমানিক লাভ: <b class="${orderProfit(d)<0?"neg":"pos"}">${money(orderProfit(d))}</b></div></div>`; }
function saveOrder(){
  const d=draft; d.items=d.items.filter(i=>(i.pid||i.name)&&num(i.qty)>0);
  if(!d.items.length) return alert("অন্তত একটি পণ্য যোগ করুন");
  for(const i of d.items){ const p=productById(i.pid); if(p&&!restores(d.status)){ const old=d._old&&!restores(d._old.status)?d._old.items.filter(x=>x.pid===i.pid).reduce((s,x)=>s+num(x.qty),0):0; if(num(i.qty)>num(p.stock)+old && !confirm(`"${p.name}" স্টকে মাত্র ${num(p.stock)+old} টি আছে। তবুও সেভ করবেন?`)) return; } }
  if(d._old&&!restores(d._old.status)) stockApply(d._old,+1);       // undo old reservation
  if(!restores(d.status)) stockApply(d,-1);
  if(d.payMethod!=="COD") d.advance=orderTotal(d);   // prepaid in full
  if(d.payMethod==="COD") d.payRef="";
  const clean={...d}; delete clean._isNew; delete clean._old;
  const idx=S.orders.findIndex(o=>o.id===d.id); if(idx>=0) S.orders[idx]=clean; else S.orders.push(clean);
  closeModal(); save(); toast("অর্ডার সেভ হয়েছে");
}

/* ============ MFS management ============ */

  <div class="grid g3" style="margin-bottom:16px">${kp("k5","⬇️","এই মাসে ক্রয় (ফ্লোট)",money(buy))}${kp("k6","⬆️","এই মাসে বিক্রয়",money(sold))}${kp("k7","💹","এই মাসে চার্জ/কমিশন আয়",money(chg))}</div>
  <div class="card"><div class="row" style="margin-bottom:12px"><select style="max-width:170px" onchange="filt.mp=this.value;render()"><option value="">সব সার্ভিস</option>${MFS_LIST.map(x=>`<option ${filt.mp===x?"selected":""}>${x}</option>`).join("")}</select>
  <select style="max-width:170px" onchange="filt.mt=this.value;render()"><option value="">ক্রয় + বিক্রয়</option><option value="buy" ${filt.mt==="buy"?"selected":""}>শুধু ক্রয়</option><option value="sale" ${filt.mt==="sale"?"selected":""}>শুধু বিক্রয়</option></select></div>
  ${list.length?`<div class="tablewrap"><table><tr><th>তারিখ</th><th>ধরন</th><th>সার্ভিস</th><th>নম্বর / রেফ</th><th class="num">পরিমাণ</th><th class="num">চার্জ</th><th>নোট</th><th></th></tr>
  ${list.map(x=>`<tr><td>${dmy(x.date)}</td><td><span class="tag ${x.type==="buy"?"st-Confirmed":"st-Delivered"}">${x.type==="buy"?"ক্রয়":"বিক্রয়"}</span></td><td>${esc(x.provider)}</td><td>${esc(x.phone||"")}</td><td class="num">${money(x.amount)}</td><td class="num">${x.type==="sale"?money(x.charge):"—"}</td><td>${esc(x.note||"")}</td><td><button class="btn sm red" onclick="delMfs('${x.id}')">✕</button></td></tr>`).join("")}</table></div>`:empty("কোনো MFS লেনদেন নেই")}</div>`;
}
function mfsForm(type){
  const buy=type==="buy";
  openModal(`<h3 style="margin-top:0">${buy?"MFS ক্রয় (ক্যাশ দিয়ে ফ্লোট কেনা)":"MFS বিক্রয় (কাস্টমারকে সেন্ড/ক্যাশ-আউট)"}</h3>
  <p class="muted" style="margin-top:0">${buy?"ক্যাশ কমবে, সিলেক্ট করা MFS ব্যালেন্স বাড়বে।":"MFS ব্যালেন্স কমবে, ক্যাশ বাড়বে (পরিমাণ + চার্জ)। চার্জটি আপনার আয়।"}</p>
  <div class="f"><div><label>তারিখ</label><input id="md" type="date" value="${today()}"></div>
  <div><label>MFS সার্ভিস</label><select id="mp">${MFS_LIST.map(x=>`<option>${x}</option>`).join("")}</select></div>
  <div><label>পরিমাণ (৳)</label><input id="ma" type="number"></div>

  <div><label>${buy?"সোর্স / রেফ":"কাস্টমার নম্বর"}</label><input id="mph"></div><div><label>নোট</label><input id="mn"></div></div>

function saveMfs(type){
  const a=num($("#ma").value); if(a<=0) return alert("পরিমাণ দিন");
  S.mfs.push({id:uid(),date:$("#md").value||today(),type,provider:$("#mp").value,amount:a,charge:type==="sale"?num($("#mc").value):0,phone:$("#mph").value,note:$("#mn").value});
  closeModal(); save();
}
function delMfs(id){ if(confirm("মুছে ফেলবেন?")){ S.mfs=S.mfs.filter(x=>x.id!==id); save(); } }

  const low=p=>num(p.stock)<=num(p.min), q=filt.pq.toLowerCase();
  const list=S.products.filter(p=>!q||(p.name+p.code+(p.category||"")).toLowerCase().includes(q));

  ${list.length?`<div class="tablewrap"><table><tr><th>কোড</th><th>পণ্য</th><th>ক্যাটাগরি</th><th class="num">ক্রয়</th><th class="num">বিক্রয়</th><th class="num">লাভ/ইউনিট</th><th class="num">স্টক</th><th class="num">ন্যূনতম</th><th></th></tr>
  ${list.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.category||"")}</td><td class="num">${money(p.cost)}</td><td class="num">${money(p.price)}</td><td class="num">${money(num(p.price)-num(p.cost))}</td><td class="num ${low(p)?"low":""}">${p.stock}${low(p)?" ⚠":""}</td><td class="num">${p.min}</td>

function nextCode(){ const n=S.products.reduce((m,p)=>{ const x=/^P(\d+)$/.exec(p.code||""); return x?Math.max(m,+x[1]):m; },0); return "P"+String(n+1).padStart(4,"0"); }
function productForm(id){
  const p=id?productById(id):{code:nextCode(),name:"",category:"Packaging",cost:"",price:"",stock:0,min:5};
  openModal(`<h3 style="margin-top:0">${id?"পণ্য এডিট":"নতুন পণ্য"}</h3><div class="f">
   <div><label>পণ্য কোড (বারকোড)</label><input id="pcode" value="${esc(p.code)}"></div>
   <div><label>নাম</label><input id="pn" value="${esc(p.name)}"></div><div><label>ক্যাটাগরি</label><input id="pc" value="${esc(p.category||"")}" list="cats"><datalist id="cats"><option>Packaging</option><option>Clothing</option><option>Leather</option><option>Accessories</option></datalist></div>
   <div><label>ক্রয় দাম</label><input id="pcost" type="number" value="${p.cost}"></div><div><label>বিক্রয় দাম</label><input id="pprice" type="number" value="${p.price}"></div>
   <div><label>বর্তমান স্টক</label><input id="pstock" type="number" value="${p.stock}"></div><div><label>ন্যূনতম স্টক (অ্যালার্ট)</label><input id="pmin" type="number" value="${p.min}"></div></div>
  <p class="muted" style="font-size:12px">কোডে শুধু ইংরেজি বড় হাতের অক্ষর, সংখ্যা ও - . $ / + % ব্যবহার করুন।</p>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="saveProduct('${id||""}')">✓ সেভ</button><button class="btn gray" onclick="closeModal()">বাতিল</button></div>`);
}
function saveProduct(id){
  const code=$("#pcode").value.trim().toUpperCase().replace(/[^0-9A-Z.\-$\/+% ]/g,"");
  const v={code,name:$("#pn").value.trim(),category:$("#pc").value.trim(),cost:num($("#pcost").value),price:num($("#pprice").value),stock:num($("#pstock").value),min:num($("#pmin").value)};
  if(!v.name) return alert("নাম দিন"); if(!v.code) return alert("পণ্য কোড দিন (ইংরেজি অক্ষর/সংখ্যা)");
  if(S.products.some(p=>p.code===v.code&&p.id!==id)) return alert("এই কোড আরেকটি পণ্যে ব্যবহৃত হয়েছে");
  if(id) Object.assign(productById(id),v); else S.products.push({id:uid(),...v});
  closeModal(); save();
}
function delItem(kind,id){ if(!confirm("মুছে ফেলবেন?")) return;
  if(kind==="purchases"){ const pu=S.purchases.find(x=>x.id===id), p=pu&&productById(pu.pid); if(p&&confirm("এই ক্রয়ের পরিমাণ স্টক থেকে বাদ দেবেন?")) p.stock=num(p.stock)-num(pu.qty); }
  S[kind]=S[kind].filter(x=>x.id!==id); save(); }

/* ============ Stock ============ */
function vStock(){
  const q=filt.sq.toLowerCase(), st=p=>num(p.stock)<=0?["শেষ","st-Returned"]:num(p.stock)<=num(p.min)?["কম","st-Pending"]:["ঠিক আছে","st-Delivered"];
  let list=S.products.filter(p=>!q||(p.name+p.code).toLowerCase().includes(q)); if(filt.lowOnly) list=list.filter(p=>num(p.stock)<=num(p.min));
  const val=S.products.reduce((s,p)=>s+num(p.stock)*num(p.cost),0), sv=S.products.reduce((s,p)=>s+num(p.stock)*num(p.price),0), pcs=S.products.reduce((s,p)=>s+num(p.stock),0);

  ${list.length?`<div class="tablewrap"><table><tr><th>কোড</th><th>পণ্য</th><th class="num">স্টক</th><th class="num">ন্যূনতম</th><th>অবস্থা</th><th class="num">ক্রয় দাম</th><th class="num">স্টক মূল্য</th><th></th></tr>
  ${list.map(p=>{ const s=st(p); return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td class="num">${p.stock}</td><td class="num">${p.min}</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td class="num">${money(p.cost)}</td><td class="num">${money(num(p.stock)*num(p.cost))}</td><td><button class="btn sm blue" onclick="adjustForm('${p.id}')">অ্যাডজাস্ট</button></td></tr>`; }).join("")}</table></div>`:empty("কোনো পণ্য নেই")}</div>`;
}

  openModal(`<h3 style="margin-top:0">স্টক অ্যাডজাস্ট — ${esc(p.name)}</h3><p class="muted" style="margin-top:0">বর্তমান স্টক: ${p.stock} (গণনা করে পেয়েছেন এমন প্রকৃত সংখ্যা দিন)</p><label>নতুন স্টক</label><input id="adj" type="number" value="${p.stock}">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="productById('${id}').stock=num($('#adj').value);closeModal();save()">✓ সেভ</button><button class="btn gray" onclick="closeModal()">বাতিল</button></div>`); }

/* ============ Purchases ============ */

/* ============ Barcode stickers (Code 39) ============ */
const C39={"0":"101000111011101","1":"111010001010111","2":"101110001010111","3":"111011100010101","4":"101000111010111","5":"111010001110101","6":"101110001110101","7":"101000101110111","8":"111010001011101","9":"101110001011101","A":"111010100010111","B":"101110100010111","C":"111011101000101","D":"101011100010111","E":"111010111000101","F":"101110111000101","G":"101010001110111","H":"111010100011101","I":"101110100011101","J":"101011100011101","K":"111010101000111","L":"101110101000111","M":"111011101010001","N":"101011101000111","O":"111010111010001","P":"101110111010001","Q":"101010111000111","R":"111010101110001","S":"101110101110001","T":"101011101110001","U":"111000101010111","V":"100011101010111","W":"111000111010101","X":"100010111010111","Y":"111000101110101","Z":"100011101110101","-":"100010101110111",".":"111000101011101"," ":"100011101011101","$":"100010001000101","/":"100010001010001","+":"100010100010001","%":"101000100010001","*":"100010111011101"};
function code39(text){ const s="*"+String(text).toUpperCase().replace(/[^0-9A-Z.\-$\/+% ]/g,"-")+"*"; return s.split("").map(c=>C39[c]).join("0"); }
function barcodeSVG(text){
  const bits=code39(text), q=10, W=bits.length+2*q; let r="", i=0;
  while(i<bits.length){ if(bits[i]==="1"){ let j=i; while(j<bits.length&&bits[j]==="1") j++; r+=`<rect x="${q+i}" y="0" width="${j-i}" height="40" fill="#000"/>`; i=j; } else i++; }
  return `<svg class="bars" viewBox="0 0 ${W} 40" preserveAspectRatio="none" role="img" aria-label="barcode ${esc(text)}">${r}</svg>`;
}

  ${S.products.length?`<div class="tablewrap"><table><tr><th><input type="checkbox" style="width:auto" onchange="S.products.forEach(p=>{bc.sel[p.id]=this.checked?(bc.sel[p.id]||1):0});render()"></th><th>কোড</th><th>পণ্য</th><th class="num">দাম</th><th style="width:100px">কপি</th><th>প্রিভিউ</th></tr>
  ${S.products.map(p=>`<tr><td><input type="checkbox" style="width:auto" ${bc.sel[p.id]?"checked":""} onchange="bc.sel['${p.id}']=this.checked?(bc.sel['${p.id}']||1):0;render()"></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td class="num">${money0(p.price)}</td>
  <td><input type="number" min="0" value="${bc.sel[p.id]||0}" oninput="bc.sel['${p.id}']=num(this.value)"></td><td style="width:140px">${barcodeSVG(p.code)}</td></tr>`).join("")}</table></div>`:empty("আগে পণ্য যোগ করুন")}</div>`;
}
function printStickers(){
  const items=S.products.filter(p=>num(bc.sel[p.id])>0); if(!items.length) return alert("অন্তত একটি পণ্য সিলেক্ট করুন");
  let h=`<div class="stkwrap ${bc.size}">`;
  items.forEach(p=>{ for(let k=0;k<num(bc.sel[p.id]);k++) h+=`<div class="stk"><div class="stn">${esc(p.name)}</div>${barcodeSVG(p.code)}<div class="stc">${esc(p.code)}</div><div class="stp">${money0(p.price)}</div></div>`; });
  printEl(h+"</div>");
}

/* ============ Business info, printable documents (invoice / quotation) ============ */
const bizDef=()=>({name:"WrappDeal",tagline:"Wrap Your Best Deal",phone:"",email:"",address:"",footer:"ধন্যবাদ — আমাদের সাথে থাকার জন্য",terms:"মূল্য কোটেশনের মেয়াদ পর্যন্ত বৈধ।"});
const biz=()=>Object.assign(bizDef(),S.biz||{});
function bizCard(){ const b=biz();
  return `<div class="card" style="margin-bottom:16px"><h3>🏢 ব্যবসার তথ্য (ইনভয়েস/কোটেশনে ছাপা হয়)</h3><div class="f">
  <div><label>ব্যবসার নাম</label><input id="bz_name" value="${esc(b.name)}"></div><div><label>ট্যাগলাইন</label><input id="bz_tag" value="${esc(b.tagline)}"></div>
  <div><label>ফোন</label><input id="bz_phone" value="${esc(b.phone)}"></div><div><label>ইমেইল</label><input id="bz_email" value="${esc(b.email)}"></div>
  <div style="grid-column:1/-1"><label>ঠিকানা</label><input id="bz_addr" value="${esc(b.address)}"></div>
  <div style="grid-column:1/-1"><label>ইনভয়েস ফুটার</label><input id="bz_foot" value="${esc(b.footer)}"></div>
  <div style="grid-column:1/-1"><label>কোটেশনের শর্তাবলি</label><input id="bz_terms" value="${esc(b.terms)}"></div></div>
  <button class="btn" style="margin-top:12px" onclick="S.biz={name:$('#bz_name').value,tagline:$('#bz_tag').value,phone:$('#bz_phone').value,email:$('#bz_email').value,address:$('#bz_addr').value,footer:$('#bz_foot').value,terms:$('#bz_terms').value};save();toast('সেভ হয়েছে')">✓ সেভ</button></div>`; }
function docHTML(kind,d){
  const b=biz(), isQ=kind==="quote", t=orderTotal(d);
  const paid=isQ?0:t-Math.max(0,orderDue(d)), due=isQ?t:Math.max(0,orderDue(d));
  return `<div class="doc"><div class="doc-h"><div><div class="doc-brand">${esc(b.name)}</div><div class="muted">${esc(b.tagline)}</div>
   <div class="doc-c">${[b.address,b.phone,b.email].filter(Boolean).map(esc).join("<br>")}</div></div>
   <div class="doc-t"><div class="doc-title">${isQ?"QUOTATION":"INVOICE"}</div><div><b>${isQ?"কোটেশন নং":"ইনভয়েস নং"}:</b> ${esc(isQ?d.no:d.inv)}</div><div><b>তারিখ:</b> ${dmy(d.date)}</div>${isQ&&d.valid?`<div><b>মেয়াদ:</b> ${dmy(d.valid)}</div>`:""}
   ${isQ?"":`<div class="stamp ${due>0?"due":"paid"}">${due>0?"DUE":"PAID"}</div>`}</div></div>
  <div class="doc-bill"><b>${isQ?"প্রস্তুত করা হয়েছে":"বিল পাঠানো হয়েছে"}:</b> ${esc(d.customer||"Walk-in")}${d.phone?" · "+esc(d.phone):""}${d.address?"<br>"+esc(d.address):""}</div>
  <table class="doc-tb"><tr><th>#</th><th>বিবরণ</th><th class="num">পরিমাণ</th><th class="num">দাম</th><th class="num">মোট</th></tr>
  ${d.items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.name)}</td><td class="num">${i.qty}</td><td class="num">${money(i.price)}</td><td class="num">${money(num(i.qty)*num(i.price))}</td></tr>`).join("")}</table>
  <table class="sum doc-sum"><tr><td>সাবটোটাল</td><td class="num">${money(orderItemsTotal(d))}</td></tr>${num(d.discount)?`<tr><td>ডিসকাউন্ট</td><td class="num">− ${money(d.discount)}</td></tr>`:""}${num(d.delivery)?`<tr><td>ডেলিভারি চার্জ</td><td class="num">${money(d.delivery)}</td></tr>`:""}
  <tr class="tot"><td>সর্বমোট</td><td class="num">${money(t)}</td></tr>${isQ?"":`<tr><td>পরিশোধ (${esc(payLabel(d))})</td><td class="num">${money(paid)}</td></tr><tr><td>বাকি</td><td class="num">${money(due)}</td></tr>`}</table>
  ${d.note&&isQ?`<div class="doc-n"><b>নোট:</b> ${esc(d.note)}</div>`:""}${isQ?`<div class="doc-n"><b>শর্তাবলি:</b> ${esc(b.terms)}</div>`:""}
  <div class="doc-f">${esc(b.footer)}</div></div>`;
}
const invoiceHTML=o=>docHTML("invoice",o);
function showDoc(html){
  openModal(`<div class="docbox">${html}</div><div class="row nop" style="margin-top:14px"><button class="btn" onclick="printEl($('.docbox').innerHTML)">🖨 প্রিন্ট / PDF</button><button class="btn gray" onclick="closeModal()">বন্ধ</button></div>
  <p class="muted nop" style="font-size:12px;margin:8px 0 0">PDF করতে: প্রিন্ট ডায়ালগে “Save as PDF” / “PDF হিসেবে সেভ করুন” বাছুন (Chrome/Safari-তে)।</p>`);
}
function showInvoice(id){ const o=typeof id==="string"?S.orders.find(x=>x.id===id):id; if(o) showDoc(invoiceHTML(o)); }

/* ============ Quotations ============ */
let qd=null;
function nextQuoteNo(date){ const d=date.replace(/-/g,""); return `QT-${d}-${String(S.quotes.filter(q=>q.no.includes("-"+d+"-")).length+1).padStart(4,"0")}`; }
function vQuotes(){
  const list=[...S.quotes].sort((a,b)=>(b.date+b.no).localeCompare(a.date+a.no)), QS={Open:["খোলা","st-Pending"],Accepted:["গৃহীত","st-Delivered"],Declined:["বাতিল","st-Cancelled"]};
  return `<div class="row" style="margin-bottom:14px"><h2 style="margin:0" class="sp">কোটেশন</h2><button class="btn" onclick="quoteForm()">＋ নতুন কোটেশন</button></div>
  <div class="card">${list.length?`<div class="tablewrap"><table><tr><th>নং</th><th>তারিখ</th><th>মেয়াদ</th><th>কাস্টমার</th><th>স্ট্যাটাস</th><th class="num">মোট</th><th></th></tr>
  ${list.map(q=>`<tr><td>${esc(q.no)}</td><td>${dmy(q.date)}</td><td>${dmy(q.valid)}</td><td>${esc(q.customer)}</td>
  <td><select style="width:auto;padding:4px 6px;font-size:12px" onchange="S.quotes.find(x=>x.id==='${q.id}').status=this.value;save()">${Object.entries(QS).map(([k,v])=>`<option value="${k}" ${q.status===k?"selected":""}>${v[0]}</option>`).join("")}</select></td>
  <td class="num">${money(orderTotal(q))}</td>
  <td><button class="btn sm" onclick="showDoc(docHTML('quote',S.quotes.find(x=>x.id==='${q.id}')))">🖨 PDF</button> <button class="btn sm blue" onclick="quoteForm('${q.id}')">এডিট</button> <button class="btn sm" style="background:#D99A00" onclick="quoteToSale('${q.id}')">→ বিক্রয়</button> <button class="btn sm red" onclick="if(confirm('মুছে ফেলবেন?')){S.quotes=S.quotes.filter(x=>x.id!=='${q.id}');save()}">✕</button></td></tr>`).join("")}</table></div>`:empty("কোনো কোটেশন নেই — ‘নতুন কোটেশন’ চাপুন")}</div>`;
}
function quoteForm(id){
  const ex=id&&S.quotes.find(q=>q.id===id);
  qd=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),no:"",date:today(),valid:addDays(today(),7),customer:"",phone:"",address:"",items:[],delivery:0,discount:0,note:"",status:"Open"};
  drawQuoteForm();
}
function drawQuoteForm(){
  const d=qd;
  openModal(`<h3 style="margin-top:0">${d.no?"কোটেশন এডিট — "+esc(d.no):"নতুন কোটেশন"}</h3>
  <div class="f2" style="margin-bottom:10px"><div><label>তারিখ</label><input type="date" value="${d.date}" oninput="qd.date=this.value"></div><div><label>মেয়াদ (পর্যন্ত বৈধ)</label><input type="date" value="${d.valid}" oninput="qd.valid=this.value"></div>
  <div><label>কাস্টমার</label><input value="${esc(d.customer)}" oninput="qd.customer=this.value"></div><div><label>ফোন</label><input value="${esc(d.phone)}" oninput="qd.phone=this.value"></div>
  <div style="grid-column:1/-1"><label>ঠিকানা</label><input value="${esc(d.address)}" oninput="qd.address=this.value"></div></div>
  <label>পণ্য</label><select onchange="addQuoteItem(this.value)"><option value="">＋ পণ্য বাছুন…</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.code)} — ${esc(p.name)} (${money0(p.price)})</option>`).join("")}</select>
  <div style="margin:10px 0">${d.items.map((it,i)=>`<div class="qline"><div class="qn">${it.pid?esc(it.name):`<input placeholder="পণ্যের নাম" value="${esc(it.name)}" oninput="qd.items[${i}].name=this.value">`}</div>
   <div><label>পরিমাণ</label><input type="number" min="1" value="${it.qty}" oninput="qd.items[${i}].qty=num(this.value);calcQuote()"></div>
   <div><label>দাম</label><input type="number" value="${it.price}" oninput="qd.items[${i}].price=this.value;calcQuote()"></div>
   <button class="btn sm red" onclick="qd.items.splice(${i},1);drawQuoteForm()">✕</button></div>`).join("")}</div>
  <button class="btn blue sm" onclick="qd.items.push({pid:'',name:'',qty:1,price:''});drawQuoteForm()">＋ কাস্টম আইটেম</button>
  <div class="f2" style="margin:12px 0"><div><label>ডিসকাউন্ট</label><input type="number" value="${d.discount}" oninput="qd.discount=this.value;calcQuote()"></div><div><label>ডেলিভারি চার্জ</label><input type="number" value="${d.delivery}" oninput="qd.delivery=this.value;calcQuote()"></div>
  <div style="grid-column:1/-1"><label>নোট</label><input value="${esc(d.note)}" oninput="qd.note=this.value"></div></div>
  <div id="qcalc" class="card" style="background:#e8f5f2;margin-bottom:14px"></div>
  <div class="row"><button class="btn" onclick="saveQuote(false)">✓ সেভ</button><button class="btn blue" onclick="saveQuote(true)">সেভ ও প্রিন্ট/PDF</button><button class="btn gray" onclick="closeModal()">বাতিল</button></div>`);
  calcQuote();
}
function addQuoteItem(pid){ const p=productById(pid); if(!p) return; const ex=qd.items.find(i=>i.pid===pid); if(ex) ex.qty=num(ex.qty)+1; else qd.items.push({pid:p.id,name:p.name,qty:1,price:p.price}); drawQuoteForm(); }
function calcQuote(){ const el=$("#qcalc"); if(el) el.innerHTML=`মোট: <b>${money(orderTotal(qd))}</b>`; }
function saveQuote(print){
  const d=qd; d.items=d.items.filter(i=>(i.pid||i.name)&&num(i.qty)>0); if(!d.items.length) return alert("অন্তত একটি পণ্য যোগ করুন");
  if(!d.no) d.no=nextQuoteNo(d.date);
  d.items=d.items.map(i=>({pid:i.pid,name:i.name,qty:num(i.qty),price:num(i.price)})); d.delivery=num(d.delivery); d.discount=num(d.discount);
  const k=S.quotes.findIndex(q=>q.id===d.id); if(k>=0) S.quotes[k]=d; else S.quotes.push(d);
  closeModal(); save(); toast("কোটেশন সেভ হয়েছে"); if(print) showDoc(docHTML("quote",d));
}
function quoteToSale(id){
  const q=S.quotes.find(x=>x.id===id); if(!q) return; newSale();
  Object.assign(sale,{customer:q.customer,phone:q.phone,address:q.address,delivery:q.delivery,discount:q.discount,note:"কোটেশন "+q.no,status:"Pending",channel:"Facebook"});
  sale.items=q.items.map(i=>{ const p=productById(i.pid); return {pid:i.pid,code:p?p.code:"",name:i.name,qty:i.qty,price:i.price,cost:p?p.cost:0}; });
  q.status="Accepted"; save(); go("sale"); toast("কোটেশন থেকে বিক্রয়ের ফর্ম ভরা হয়েছে");
}

/* ============ Settings ============ */
function vSettings(){
  const secCard=`<div class="card" style="margin-bottom:16px"><h3>🔐 সিকিউরিটি</h3>${SEC?`<p style="margin-top:0">🟢 পাসওয়ার্ড সুরক্ষা <b>চালু</b>। ডেটা ও টোকেন AES-256 দিয়ে এনক্রিপ্টেড, GitHub-এও এনক্রিপ্টেড ডেটা যায়। ১০ মিনিট নিষ্ক্রিয় থাকলে অটো-লক হয়।</p><div class="row"><button class="btn blue" onclick="setPasswordUI(true)">পাসওয়ার্ড বদলান</button><button class="btn" onclick="lockNow()">🔒 এখনই লক করুন</button></div>`:`<p style="margin-top:0">⚠️ পাসওয়ার্ড সুরক্ষা <b>চালু নেই</b>। চালু করলে ডেটা ও GitHub টোকেন এনক্রিপ্ট হবে এবং অ্যাপ খুলতে পাসওয়ার্ড লাগবে।</p><button class="btn" onclick="setPasswordUI(false)">🔐 পাসওয়ার্ড সেট করুন</button>`}</div>`;
  return `<h2>সেটিংস / GitHub সিঙ্ক</h2>${secCard}${bizCard()}
  <div class="card" style="margin-bottom:16px"><h3>GitHub ক্লাউড স্টোরেজ</h3>
  <p class="muted" style="margin-top:0">ডেটা আপনার GitHub রিপোজিটরির একটি JSON ফাইলে সেভ হয়। টোকেন শুধু এই ব্রাউজারে থাকে — ডেটা ফাইলে বা কোডে যায় না।</p>
  <div class="f"><div><label>GitHub ইউজারনেম</label><input id="gho" value="${esc(GH.owner||"")}" placeholder="your-username"></div>
  <div><label>রিপোজিটরি (প্রাইভেট ডেটা রিপো)</label><input id="ghr" value="${esc(GH.repo||"")}" placeholder="wrappdeal-data"></div>
  <div><label>ব্রাঞ্চ</label><input id="ghb" value="${esc(GH.branch||"main")}"></div>
  <div><label>ফাইল পাথ</label><input id="ghp" value="${esc(GH.path||"wrappdeal-data.json")}"></div>
  <div style="grid-column:1/-1"><label>Fine-grained Personal Access Token</label><input id="ght" type="password" value="${esc(GH.token||"")}" placeholder="github_pat_..."></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveGH()">✓ সংযোগ সেভ ও সিঙ্ক</button><button class="btn blue" onclick="pull()">⬇ GitHub থেকে লোড</button><button class="btn blue" onclick="push()">⬆ এখনই GitHub-এ সেভ</button><button class="btn red" onclick="disconnect()">সংযোগ বিচ্ছিন্ন</button></div></div>
  <div class="card" style="margin-bottom:16px"><h3>ব্যাকআপ</h3><div class="row"><button class="btn blue" onclick="dl('wrappdeal-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')">⬇ JSON ব্যাকআপ</button>
  <label class="btn gray" style="display:inline-block;margin:0;color:#fff;cursor:pointer">⬆ ব্যাকআপ ইমপোর্ট<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>
  <button class="btn red" onclick="if(confirm('সব ডেটা মুছে যাবে!')&&confirm('নিশ্চিত?')){S=blank();save()}">সব ডেটা রিসেট</button></div></div>
  <div class="card"><h3>সেটআপ গাইড</h3><ol style="line-height:1.9;margin:0;padding-left:20px">
  <li>GitHub-এ একটি <b>Private</b> রিপো খুলুন (যেমন <code>wrappdeal-data</code>) — “Add a README” টিক দিন।</li>
  <li>Settings → Developer settings → Fine-grained tokens → নতুন টোকেন: শুধু ওই রিপো সিলেক্ট, Permission: <b>Contents → Read and write</b>।</li>
  <li>উপরের ফর্মে ইউজারনেম, রিপো, টোকেন বসিয়ে সেভ করুন। ফাইল নিজে থেকে তৈরি হবে।</li>
  <li>অন্য ফোন/পিসিতে একই পেজ খুলে একই তথ্য দিন — ডেটা চলে আসবে।</li></ol></div>`;
}
function saveGH(){ GH={owner:$("#gho").value.trim(),repo:$("#ghr").value.trim(),branch:$("#ghb").value.trim()||"main",path:$("#ghp").value.trim()||"wrappdeal-data.json",token:$("#ght").value.trim()}; persistGH(); META.sha=null; pull(); }
function disconnect(){ if(!confirm("টোকেন এই ব্রাউজার থেকে মুছে ফেলবেন?")) return; GH={}; localStorage.removeItem("wd_gh"); render(); }
function importJSON(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ S=Object.assign(blank(),JSON.parse(r.result)); save(); toast("ইমপোর্ট সম্পন্ন"); }catch(e){ alert("ফাইল ঠিক নয়"); } }; r.readAsText(f); }

window.addEventListener("beforeunload",e=>{ if(!skipUnload&&META.dirty&&ghReady()){ e.preventDefault(); e.returnValue=""; } });
function boot(){ render(); writeFeed(); if(ghReady()) pull(); }
if(SEC) showLock(); else boot();
</script>
